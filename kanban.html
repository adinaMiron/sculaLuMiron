<!doctype html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanban — Scula lu Miron</title>
<style>
  :root { --bg:#14201A; --surface:#1B2A22; --surface-2:#22342A; --border:#2E4739; --accent:#C1BB45; --text:#F3EEE1; --muted:#9FB3A5; --quiet:#789084; --danger:#C4643C; --ok:#6E9E8A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, input, select { font:inherit; }
  button, select { cursor:pointer; }
  .kanban-shell { padding:clamp(14px,2vw,30px); max-width:1800px; margin:auto; }
  .kanban-head { display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px; margin-bottom:20px; }
  .kanban-head h1 { margin:0; font-size:clamp(24px,3vw,36px); letter-spacing:-.035em; }
  .kanban-head p { margin:3px 0 0; color:var(--muted); }
  .kanban-head button { margin-left:auto; }
  .controls { display:flex; flex-wrap:wrap; align-items:end; gap:12px; padding:16px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
  .control { display:flex; flex-direction:column; gap:5px; min-width:160px; flex:1 1 160px; }
  .control.search { flex:2 1 230px; }
  .control label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .control input, .control select, .card select { min-height:42px; width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--bg); }
  .control input:focus-visible, .control select:focus-visible, .card select:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .btn { border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); padding:9px 14px; min-height:42px; }
  .btn:hover, .card a:hover { border-color:var(--accent); color:var(--accent); }
  .summary { display:flex; align-items:center; flex-wrap:wrap; gap:10px; min-height:48px; color:var(--muted); }
  .summary strong { color:var(--accent); font-size:18px; }
  .summary .sep { color:var(--border); }
  #notice { color:var(--danger); margin-left:auto; }
  .board { display:grid; grid-template-columns:repeat(5,minmax(220px,1fr)); gap:12px; overflow-x:auto; padding-bottom:18px; align-items:start; }
  .lane { min-width:220px; border:1px solid var(--border); border-radius:13px; background:var(--surface); min-height:180px; overflow:hidden; }
  .lane.over { outline:2px dashed var(--accent); outline-offset:-5px; }
  .lane-head { display:flex; align-items:center; gap:8px; padding:13px 14px; border-bottom:1px solid var(--border); border-top:3px solid var(--lane-color); }
  .lane-head h2 { margin:0; font-size:15px; flex:1; }
  .lane-head span { border-radius:999px; min-width:25px; padding:2px 6px; text-align:center; background:var(--surface-2); color:var(--muted); font-size:12px; }
  .lane-cards { display:flex; flex-direction:column; gap:9px; padding:10px; }
  .lane-empty { padding:22px 8px; text-align:center; color:var(--quiet); font-size:12px; }
  .card { padding:12px; border:1px solid var(--border); border-radius:10px; background:var(--surface-2); overflow-wrap:anywhere; }
  .card[draggable="true"] { cursor:grab; }
  .card.dragging { opacity:.5; }
  .card.vital { border-left:3px solid var(--danger); }
  .card.important { border-left:3px solid #D9A441; }
  .card-title { margin:0 0 8px; font-size:14px; font-weight:650; line-height:1.4; white-space:pre-wrap; }
  .card-path { color:var(--muted); font-size:11px; margin-bottom:9px; }
  .card-meta { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  .pill { display:inline-flex; align-items:center; max-width:100%; padding:3px 7px; border:1px solid var(--border); border-radius:999px; color:var(--muted); font-size:11px; }
  .pill.priority { color:#E7C875; }
  .pill.overdue { color:#F0A284; border-color:#8D4735; }
  .card-actions { display:flex; align-items:center; gap:7px; }
  .card-actions select { min-height:34px; font-size:12px; flex:1; }
  .card-actions a { color:var(--muted); border:1px solid var(--border); border-radius:8px; padding:7px 9px; text-decoration:none; font-size:12px; white-space:nowrap; }
  .empty-page { grid-column:1/-1; padding:46px 16px; text-align:center; border:1px dashed var(--border); border-radius:14px; color:var(--muted); }
  .empty-page a { color:var(--accent); }
  @media(max-width:1150px) { .board { grid-template-columns:repeat(5,minmax(250px,1fr)); } }
  @media(max-width:700px) { .kanban-shell { padding:12px; } .kanban-head button { margin-left:0; } .controls { gap:10px; padding:12px; } .control { min-width:calc(50% - 5px); } .control.search, .control.scope { min-width:100%; } .board { scroll-snap-type:x mandatory; } .lane { scroll-snap-align:start; } }
</style>
</head>
<body>
<nav id="site-nav" aria-label="Instrumente">
  <a href="index.html" data-page="index.html">Markdown</a>
  <a href="calendar.html" data-page="calendar.html">Calendar</a>
  <a href="kanban.html" data-page="kanban.html">Kanban</a>
  <a href="map.html" data-page="map.html">Hartă</a>
  <a href="voice.html" data-page="voice.html">Caiet vocal</a>
  <a href="song.html" data-page="song.html">Creează melodie</a>
  <a href="recipes.html" data-page="recipes.html">Rețete</a>
  <a href="editor.html" data-page="editor.html">Mazgaleste</a>
  <a href="transfer.html" data-page="transfer.html">Transfer</a>
  <button id="navFolderBtn" type="button">📁 <span id="navFolderName">Dosar</span></button>
  <button id="navLangBtn" type="button" aria-label="Limba interfeței / Interface language">EN</button>
</nav>
<style>
  #site-nav{
    display:flex;gap:4px;align-items:center;
    background:#14201A;
    border-bottom:1px solid #2E4739;
    padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  #site-nav a{
    flex:0 0 auto;
    color:#9FB3A5;
    text-decoration:none;
    font-size:13px;
    letter-spacing:.03em;
    padding:8px 12px;
    border-radius:999px;
    border:1px solid transparent;
    white-space:nowrap;
  }
  #site-nav a:hover{ color:#F3EEE1; }
  #site-nav a.current{
    color:#1A2117;
    background:#C1BB45;
    border-color:#C1BB45;
    font-weight:600;
  }
  #site-nav #navFolderBtn,
  #site-nav #navLangBtn{
    flex:0 0 auto;
    background:transparent;
    color:#9FB3A5;
    border:1px solid #2E4739;
    border-radius:999px;
    padding:7px 11px;
    font-family:inherit;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  #site-nav #navFolderBtn:hover,
  #site-nav #navLangBtn:hover{ color:#F3EEE1; }
  #site-nav #navFolderBtn{
    margin-left:auto;
    letter-spacing:.04em;
    text-transform:none;
    max-width:min(42vw,240px);
    overflow:hidden;
    text-overflow:ellipsis;
  }
  #site-nav #navFolderBtn.set{ color:#C1BB45; border-color:#5A6B2E; }
  @media (max-width:560px){
    /* A long folder name must not push the language toggle out of reach on a
       phone - the nav scrolls, but the toggle should still be visible. */
    #site-nav #navFolderBtn{ max-width:min(30vw,140px); }
  }
  /* No phone or tablet browser has showDirectoryPicker, so on those devices
     the button just names the fallback route (share/download) and a tap
     opens the destination sheet instead of the picker - see the "supported()"
     branch in fBtn's click handler below. Kept visible (not hidden) so a
     phone still has a way to reach ScuLaFolder.chooser() from the nav. */
  #scula-toast{
    position:fixed;
    left:50%;
    bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%);
    z-index:99999;
    max-width:min(90vw,520px);
    background:#14201A;
    color:#F3EEE1;
    border:1px solid #2E4739;
    border-radius:10px;
    padding:10px 14px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:13px;
    line-height:1.4;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease;
    word-break:break-word;
    display:flex;
    gap:12px;
    align-items:center;
  }
  #scula-toast.show{ opacity:1; }
  #scula-toast.acting{ pointer-events:auto; }
  #scula-toast button{
    flex:0 0 auto;
    background:#C1BB45;
    color:#1A2117;
    border:0;
    border-radius:999px;
    padding:8px 14px;
    min-height:44px;
    font:inherit;
    font-weight:600;
    cursor:pointer;
  }
  #scula-sheet{
    position:fixed; inset:0; z-index:100000;
    display:none;
    align-items:center; justify-content:center;
    background:rgba(0,0,0,.55);
    padding:16px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #scula-sheet.open{ display:flex; }
  #scula-sheet .card{
    width:min(420px,100%);
    background:#14201A;
    color:#F3EEE1;
    border:1px solid #2E4739;
    border-radius:14px;
    padding:18px;
    box-shadow:0 12px 40px rgba(0,0,0,.5);
    max-height:calc(100vh - 32px);
    overflow-y:auto;
  }
  #scula-sheet h2{ margin:0 0 6px; font-size:16px; }
  #scula-sheet p{ margin:0 0 14px; font-size:13px; line-height:1.5; color:#9FB3A5; }
  #scula-sheet .opt{
    display:block; width:100%; text-align:left;
    background:transparent; color:#F3EEE1;
    border:1px solid #2E4739; border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
    font:inherit; cursor:pointer; min-height:44px;
  }
  #scula-sheet .opt:hover{ border-color:#5A6B2E; }
  #scula-sheet .opt.on{ border-color:#C1BB45; color:#C1BB45; }
  #scula-sheet .opt small{ display:block; margin-top:3px; font-size:12px; color:#9FB3A5; }
  #scula-sheet .opt[disabled]{ opacity:.5; cursor:not-allowed; }
  #scula-sheet .close{
    display:block; width:100%;
    background:transparent; color:#9FB3A5;
    border:0; padding:12px; margin-top:4px;
    font:inherit; cursor:pointer; min-height:44px;
  }
</style>
<script>
(function(){
  var here = location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll("#site-nav a").forEach(function(a){
    if(a.getAttribute("data-page") === here) a.classList.add("current");
  });
  // Shared UI-language toggle - see docs/I18N.md "Shared preference across
  // pages". This block is byte-identical in all nine files (CLAUDE.md rule
  // 2); it only paints itself from localStorage and broadcasts a
  // "scula-ui-lang" event. Each app's own script (loaded later, at the
  // bottom of the page) owns the actual translation via its own I18N/t()/
  // applyUILang() and reconciles against its async storage as the source of
  // truth - see that file's "6. UI language" section.
  var LANG_KEY = "scula:ui-lang";
  var lang = "ro";
  try{ lang = localStorage.getItem(LANG_KEY) || "ro"; }catch(e){}

  var btn = document.getElementById("navLangBtn");
  if(btn){
    paintLang(lang);
    btn.addEventListener("click", function(){
      lang = lang === "ro" ? "en" : "ro";
      try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
      paintLang(lang);
      paintFolder();
      window.dispatchEvent(new CustomEvent("scula-ui-lang", { detail: lang }));
    });
  }
  function paintLang(l){
    btn.textContent = l === "ro" ? "EN" : "RO";
    document.querySelector('#site-nav [data-page="song.html"]').textContent = l === "en" ? "Song Creation" : "Creează melodie";
  }

  // Some apps toggle the language from their own controls; follow along.
  window.addEventListener("scula-ui-lang", function(ev){
    if(ev.detail && ev.detail !== lang){ lang = ev.detail; if(btn) paintLang(lang); paintFolder(); }
  });

  /* ============================================================
     Shared save destination (window.ScuLaFolder)
     ------------------------------------------------------------
     Pages never build their own <a download>; they call
     ScuLaFolder.save(name, blob) and this decides where the bytes go.
     Three routes, in order of preference:

       "folder"   desktop Chrome/Edge. One directory picked once via the
                  File System Access API, kept in IndexedDB (a directory
                  handle is not a string, so localStorage cannot hold
                  it). Each page writes into its own subfolder - SUBDIR.
       "share"    phones and tablets, where no browser implements
                  showDirectoryPicker. navigator.share({files}) hands the
                  file to the OS share sheet, where "Save to Files"
                  (iOS) / the Files app (Android) lets the person drop it
                  in any folder they like. No folder can be *remembered*
                  there - the OS picker owns that choice.
       "download" last resort, and always available.

     Byte-identical in all nine files (CLAUDE.md rule 2) - see
     docs/FEATURES.md "Saving files".
     ============================================================ */
  var DB_NAME = "scula-fs", DB_STORE = "handles", DB_KEY = "root", MODE_KEY = "mode";
  var SUBDIR = {
    "voice.html": "transcript",
    "song.html": "Song Creation",
    "calendar.html": "calendar",
    "kanban.html": "kanban",
    "map.html": "harta",
    "editor.html": "desen",
    "index.html": "markdown",
    "recipes.html": "retete",
    "transfer.html": "transfer"
  };
  var T = {
    ro:{
      pickLabel:"Dosar",
      modeShare:"Fișiere",
      modeDownload:"Descărcări",
      tipDesktop:"Alege dosarul implicit pentru fișierele salvate (clic dreapta: renunță la dosar)",
      tipMobile:"Alege unde ajung fișierele salvate",
      unsupported:"Browserul acesta nu poate ține minte un dosar. Fișierele se descarcă normal.",
      denied:"Acces refuzat la dosar. Fișierele se descarcă normal.",
      picked:function(n){ return "Dosar implicit: " + n; },
      cleared:"Dosarul implicit a fost șters. Fișierele se descarcă normal.",
      clearAsk:function(n){ return "Renunți la dosarul implicit „" + n + "”?"; },
      saved:function(p){ return "Salvat în " + p; },
      shared:function(n){ return "Trimis către aplicații: " + n; },
      downloaded:function(n){ return "Descărcat: " + n; },
      failed:"Nu s-a putut scrie în dosar. Fișierul a fost descărcat.",
      tapToSave:function(n){ return "Fișierul „" + n + "” e gata."; },
      tapAction:"Salvează",
      sheetTitle:"Unde salvezi fișierele?",
      sheetIntroMobile:"Pe telefon și tabletă niciun browser nu poate ține minte un dosar. Prin „Salvează în Fișiere” alegi tu dosarul de fiecare dată - iar sistemul îl reține pe ultimul folosit.",
      sheetIntroDesktop:"Alege ce se întâmplă când salvezi.",
      optShare:"Salvează în Fișiere",
      optShareSub:"Deschide fereastra de partajare a sistemului: alegi dosarul pe care îl vrei.",
      optShareOff:"Browserul acesta nu poate trimite fișiere către aplicații.",
      optDownload:"Descarcă",
      optDownloadSub:"Merge direct în dosarul Descărcări.",
      optFolder:"Alege un dosar…",
      optFolderSub:"Un singur dosar pentru toate paginile, ținut minte între vizite.",
      sheetClose:"Închide",
      modeSetShare:"Fișierele merg către fereastra de partajare.",
      modeSetDownload:"Fișierele se descarcă."
    },
    en:{
      pickLabel:"Folder",
      modeShare:"Files",
      modeDownload:"Downloads",
      tipDesktop:"Choose the default folder for saved files (right-click: forget the folder)",
      tipMobile:"Choose where saved files go",
      unsupported:"This browser can't remember a folder. Files download normally instead.",
      denied:"Folder access denied. Files download normally instead.",
      picked:function(n){ return "Default folder: " + n; },
      cleared:"Default folder cleared. Files download normally instead.",
      clearAsk:function(n){ return "Forget the default folder “" + n + "”?"; },
      saved:function(p){ return "Saved to " + p; },
      shared:function(n){ return "Sent to your apps: " + n; },
      downloaded:function(n){ return "Downloaded: " + n; },
      failed:"Couldn't write into the folder. The file was downloaded instead.",
      tapToSave:function(n){ return "“" + n + "” is ready."; },
      tapAction:"Save",
      sheetTitle:"Where do saved files go?",
      sheetIntroMobile:"On phones and tablets no browser can remember a folder. “Save to Files” lets you pick the folder yourself each time - and the system remembers the last one you used.",
      sheetIntroDesktop:"Choose what happens when you save.",
      optShare:"Save to Files",
      optShareSub:"Opens the system share sheet, where you pick any folder you like.",
      optShareOff:"This browser can't hand files to other apps.",
      optDownload:"Download",
      optDownloadSub:"Goes straight to the Downloads folder.",
      optFolder:"Choose a folder…",
      optFolderSub:"One folder for every page, remembered between visits.",
      sheetClose:"Close",
      modeSetShare:"Files now go to the share sheet.",
      modeSetDownload:"Files now download."
    }
  };
  function tx(k){ return (T[lang] || T.ro)[k]; }

  var fBtn = document.getElementById("navFolderBtn");
  var fName = document.getElementById("navFolderName");
  var root = null;          // FileSystemDirectoryHandle, desktop only
  var mode = null;          // "share" | "download" | null (= pick for me)
  var toastEl = null, toastTimer = 0;
  var sheetEl = null;

  function supported(){ return typeof window.showDirectoryPicker === "function"; }
  function subdir(){ return SUBDIR[here] || "scula"; }

  // Sharing a *file* is Web Share level 2: iOS Safari 15+, Android Chrome.
  // canShare() is the only honest test - navigator.share alone exists in
  // browsers that refuse files.
  function canShareFiles(){
    try{
      if(!navigator.share || !navigator.canShare || typeof File !== "function") return false;
      return navigator.canShare({ files:[ new File(["x"], "x.txt", { type:"text/plain" }) ] });
    }catch(e){ return false; }
  }

  function currentMode(){
    if(root) return "folder";
    if(mode === "share") return canShareFiles() ? "share" : "download";
    if(mode === "download") return "download";
    // Unset: on a device with no directory picker the share sheet is the
    // only route into a folder the person chooses, so prefer it there.
    return (!supported() && canShareFiles()) ? "share" : "download";
  }

  function toast(msg, action, onAction){
    if(!msg) return;
    if(!toastEl){
      toastEl = document.createElement("div");
      toastEl.id = "scula-toast";
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = "";
    toastEl.classList.remove("acting");
    toastEl.appendChild(document.createTextNode(msg));
    clearTimeout(toastTimer);
    if(action && onAction){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = action;
      b.addEventListener("click", function(){
        toastEl.classList.remove("show", "acting");
        onAction();
      });
      toastEl.appendChild(b);
      toastEl.classList.add("acting");
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show", "acting"); }, 30000);
    } else {
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 4200);
    }
    toastEl.classList.add("show");
  }

  function paintFolder(){
    if(!fBtn) return;
    var m = currentMode();
    fBtn.title = supported() ? tx("tipDesktop") : tx("tipMobile");
    fBtn.setAttribute("aria-label", fBtn.title);
    // Desktop with nothing chosen yet reads as an invitation ("Dosar"), since
    // the tap opens the picker. Where there is no picker the button names the
    // route a save will actually take, because that is what the tap changes.
    fName.textContent = m === "folder" ? root.name
      : (supported() ? tx("pickLabel")
      : (m === "share" ? tx("modeShare") : tx("modeDownload")));
    fBtn.classList.toggle("set", m === "folder" || (!supported() && m === "share"));
  }

  function idb(){
    return new Promise(function(res, rej){
      var r;
      try{ r = indexedDB.open(DB_NAME, 1); }catch(e){ rej(e); return; }
      r.onupgradeneeded = function(){ r.result.createObjectStore(DB_STORE); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function idbTx(mode2, run){
    return idb().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction(DB_STORE, mode2);
        var req = run(t.objectStore(DB_STORE));
        t.oncomplete = function(){ db.close(); res(req ? req.result : undefined); };
        t.onerror = function(){ db.close(); rej(t.error); };
      });
    });
  }
  function idbGet(k){ return idbTx("readonly", function(s){ return s.get(k); }); }
  function idbPut(k, v){ return idbTx("readwrite", function(s){ return s.put(v, k); }); }
  function idbDel(k){ return idbTx("readwrite", function(s){ return s.delete(k); }); }

  // requestPermission() needs a user gesture, so pass request:true only from
  // inside a click handler.
  function permitted(handle, request){
    if(!handle || typeof handle.queryPermission !== "function") return Promise.resolve(!!handle);
    var opts = { mode:"readwrite" };
    return handle.queryPermission(opts).then(function(state){
      if(state === "granted") return true;
      if(!request) return false;
      return handle.requestPermission(opts).then(function(s){ return s === "granted"; });
    }).catch(function(){ return false; });
  }

  function announce(){
    paintFolder();
    window.dispatchEvent(new CustomEvent("scula-folder", {
      detail: { name: root ? root.name : null, mode: currentMode() }
    }));
  }

  function pick(){
    if(!supported()){ toast(tx("unsupported")); return Promise.resolve(null); }
    return window.showDirectoryPicker({ id:"scula-root", mode:"readwrite", startIn:"documents" })
      .then(function(h){
        return permitted(h, true).then(function(ok){
          if(!ok){ toast(tx("denied")); return null; }
          root = h;
          return idbPut(DB_KEY, h).catch(function(){}).then(function(){
            // Give every page its folder up front, so the layout is visible
            // in the file manager before anything has been saved.
            var chain = Promise.resolve();
            Object.keys(SUBDIR).forEach(function(k){
              chain = chain.then(function(){
                return h.getDirectoryHandle(SUBDIR[k], { create:true }).catch(function(){});
              });
            });
            return chain;
          }).then(function(){
            announce();
            toast(tx("picked")(h.name));
            return h;
          });
        });
      })
      .catch(function(){ return null; });  // AbortError: the user cancelled
  }

  function forget(){
    root = null;
    return idbDel(DB_KEY).catch(function(){}).then(function(){
      announce();
      toast(tx("cleared"));
    });
  }

  function setMode(m){
    mode = m;
    return idbPut(MODE_KEY, m).catch(function(){}).then(function(){
      announce();

    });

    b.type = "button";
    b.className = "opt" + (on ? " on" : "");
    b.appendChild(document.createTextNode(label));
    var s = document.createElement("small");
    s.textContent = sub;
    b.appendChild(s);
    if(enabled) b.addEventListener("click", onPick); else b.disabled = true;
    return b;
  }

    var m = currentMode();
    if(!sheetEl){
      sheetEl = document.createElement("div");
      sheetEl.id = "scula-sheet";
      sheetEl.setAttribute("role", "dialog");
      sheetEl.setAttribute("aria-modal", "true");
      sheetEl.addEventListener("click", function(ev){ if(ev.target === sheetEl) closeSheet(); });
      document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeSheet(); });
      document.body.appendChild(sheetEl);
    }
    var card = document.createElement("div");
    card.className = "card";
    var h = document.createElement("h2");
    h.textContent = tx("sheetTitle");
    var p = document.createElement("p");
    p.textContent = supported() ? tx("sheetIntroDesktop") : tx("sheetIntroMobile");
    card.appendChild(h);
    card.appendChild(p);

    if(supported()){
      card.appendChild(option(tx("optFolder"), tx("optFolderSub"), m === "folder", true,
        function(){ closeSheet(); pick(); }));
    }
    var shareOk = canShareFiles();
    card.appendChild(option(tx("optShare"), shareOk ? tx("optShareSub") : tx("optShareOff"),
      m === "share", shareOk, function(){ closeSheet(); setMode("share"); }));
    card.appendChild(option(tx("optDownload"), tx("optDownloadSub"), m === "download", true,
      function(){ closeSheet(); setMode("download"); }));

    var c = document.createElement("button");
    c.type = "button";
    c.className = "close";
    c.textContent = tx("sheetClose");
    c.addEventListener("click", closeSheet);
    card.appendChild(c);

  // The chosen root folder itself, or null. dir() below narrows it to this
  // page's own subfolder; a page that moves the *whole* folder across
  // (transfer.html sends it to another device, and writes a received tree
  // back into it) needs the root, with the same permission dance.
  function rootDir(request){
    if(!root) return Promise.resolve(null);
    return permitted(root, request !== false).then(function(ok){
      return ok ? root : null;
    }).catch(function(){ return null; });
  }

  function dir(request){
    if(!root) return Promise.resolve(null);
    return permitted(root, request !== false).then(function(ok){
      if(!ok) return null;
      return root.getDirectoryHandle(subdir(), { create:true });
    }).catch(function(){ return null; });

    var ext = dot > 0 ? filename.slice(dot) : "";

    function attempt(){
      var name = i === 0 ? filename : base + "-" + i + ext;
      return d.getFileHandle(name).then(function(){
        i++;

    // "text" file next to the real one. Filename-only files avoids that.

      // silently downloading behind their back would be wrong.

      // it, and iOS will not open the sheet without one. Offer a fresh tap.
      if(n === "NotAllowedError" || n === "SecurityError"){
        toast(tx("tapToSave")(filename), tx("tapAction"), function(){ shareOut(filename, blob, quiet); });
        return { saved:false, pending:true, name:filename, path:filename, message:null };

    });

  // happened in the app's own UI (null = say nothing), or leave `quiet` off
  // and the shared toast speaks.

    // callers include ownership in the filename; share/download stay flat.
    var folders = opts && opts.directories || [];
    if(!Array.isArray(folders) || folders.some(function(p){
      return typeof p !== "string" || !p || p === "." || p === ".." || /[\\/\x00-\x1f<>:"|?*]/.test(p) || /[. ]$/.test(p);
    })) return Promise.resolve({ saved:false, message:tx("failed"), via:"folder" });

    if(m === "share") return shareOut(filename, blob, quiet);
    if(m !== "folder") return Promise.resolve(downloadResult(filename, blob, quiet));
    return dir().then(function(d){
      if(!d) return null;
      var nested = Promise.resolve(d);
      folders.forEach(function(p){ nested = nested.then(function(h){ return h.getDirectoryHandle(p, { create:true }); }); });

            return Promise.resolve(w.write(blob)).then(function(){ return w.close(); });
          }).then(function(){
            return { saved:true, via:"folder", name:name,

          });
        });
      });
    }); }).catch(function(){ return { failed:true }; }).then(function(r){
      if(r && r.saved){ r.message = tx("saved")(r.path); return report(r, quiet); }
      return downloadResult(filename, blob, quiet, r && r.failed ? tx("failed") : "");
    });
  }

  var ready = Promise.all([
    idbGet(DB_KEY).catch(function(){ return null; }),
    idbGet(MODE_KEY).catch(function(){ return null; })
  ]).then(function(vals){
    if(vals[1] === "share" || vals[1] === "download") mode = vals[1];
    var h = vals[0];
    if(!h){ paintFolder(); return null; }
    return permitted(h, false).then(function(ok){

      return ok ? h : null;
    });
  }).catch(function(){ paintFolder(); return null; });

    paintFolder();
    // Desktop goes straight to the directory picker - that is the whole
    // feature there. Everywhere else the picker does not exist, so offer the
    // routes that do.
    fBtn.addEventListener("click", function(){ if(supported()) pick(); else openSheet(); });
    fBtn.addEventListener("contextmenu", function(ev){
      ev.preventDefault();
      if(root && confirm(tx("clearAsk")(root.name))) forget();
      else openSheet();
    });
  }

  window.ScuLaFolder = {
    supported: supported,
    canShareFiles: canShareFiles,
    isSet: function(){ return !!root; },
    name: function(){ return root ? root.name : null; },
    mode: currentMode,
    setMode: setMode,
    subdir: subdir,
    ready: ready,
    pick: pick,
    forget: forget,
    chooser: openSheet,
    dir: dir,
    rootDir: rootDir,
    save: save,
    download: download,
    toast: toast
  };
})();

/* ============================================================
   Shared calendar store (window.ScuLaCal)
   ------------------------------------------------------------
   One event store every page can write into, next to ScuLaFolder
   and for the same reason: there is no build step here, so the
   nav block is where shared code lives (CLAUDE.md rule 2).

   Events are kept in the *Google Calendar API* event shape - not
   in a private format converted on the way out. So the export is
   already a valid body for events.insert, and nothing can drift
   between "what we store" and "what Google accepts". Our own
   fields ride along in extendedProperties.private, which Google
   round-trips (values there must be strings, so they are).

   Times: a timed event carries an RFC-3339 dateTime with the
   local offset plus its IANA timeZone; an all-day event carries
   start.date / end.date, and **end.date is exclusive** - the same
   trap Google has. when()/daysOf() are the only places that know
   it; read a range through them, never off the raw field.

   See docs/FEATURES.md "L. The calendar".

  var COLORS = [
    { id:"1",  hex:"#7986CB", key:"colLavender" },
    { id:"2",  hex:"#33B679", key:"colSage"     },
    { id:"3",  hex:"#8E24AA", key:"colGrape"    },
    { id:"4",  hex:"#E67C73", key:"colFlamingo" },
    { id:"5",  hex:"#F6BF26", key:"colBanana"   },
    { id:"6",  hex:"#F4511E", key:"colTangerine"},
    { id:"7",  hex:"#039BE5", key:"colPeacock"  },
    { id:"8",  hex:"#616161", key:"colGraphite" },
    { id:"9",  hex:"#3F51B5", key:"colBlueberry"},
    { id:"10", hex:"#0B8043", key:"colBasil"    },
    { id:"11", hex:"#D50000", key:"colTomato"   }
  ];
  function colorHex(id){
    for(var i=0;i<COLORS.length;i++) if(COLORS[i].id === String(id)) return COLORS[i].hex;
    return COLORS[6].hex;
  }

/* ---- dates ---- */
  function pad(n){ return (n < 10 ? "0" : "") + n; }

  // sorts or filters goes through here, so the exclusive end.date is
  // handled once.

    r.onerror = function(){ rej(r.error); };

      t.onerror = function(){ db.close(); rej(t.error); };

    });

  function lsRead(){
    if(memEv) return memEv;
    try{ return JSON.parse(localStorage.getItem(LS_EV) || "[]"); }
    catch(e){ memEv = memEv || []; return memEv; }
  }
  function lsWrite(list){
    if(memEv){ memEv = list; return; }
    try{ localStorage.setItem(LS_EV, JSON.stringify(list)); }
    catch(e){ memEv = list; }
  }

  function all(){
    return tx(EV, "readonly", function(s){ return s.getAll(); })
      .then(function(r){ return r || []; })
      .catch(function(){ return lsRead(); });
  }
  function putRaw(ev){

  function metaGet(k){
    return tx(META, "readonly", function(s){ return s.get(k); })
      .catch(function(){

    return tx(META, "readwrite", function(s){ return s.put(v, k); })
      .catch(function(){

    chan = new BroadcastChannel("scula-cal");
    chan.onmessage = function(){ subs.forEach(function(f){ try{ f(); }catch(e){} }); };
  }catch(e){ chan = null; }

/* ---- building an event without hand-writing Google's shape ---- */

  // Pages call this; only this function knows the API field names.
  function make(o){

    var ev = {
      id: o.id || newId(),
      summary: String(o.title || o.summary || "").trim(),
      description: String(o.description || ""),
      location: String(o.location || ""),
      status: o.status || "confirmed",
      colorId: String(o.colorId || "7"),
    start: {}, end: {},
      reminders: o.reminders || { useDefault:true },
      created: o.created || new Date().toISOString(),
      updated: new Date().toISOString()
    };
    if(o.recurrence && o.recurrence.length) ev.recurrence = o.recurrence.slice();
    if(o.allDay){
    var s = o.date, e = o.endDate || o.date;

      // first day they do *not*. Convert here, once.

  function syncSource(source, ref, list){

    mine.forEach(function(e){ var k = priv(e, "sculaKey"); if(k) byKey[k] = e; });

      if(k && byKey[k]){ ev.id = byKey[k].id; ev.created = byKey[k].created; keep[byKey[k].id] = 1; kept++; }
        else added++;
        out.push(ev);

    var chain = Promise.resolve();
    gone.forEach(function(e){ chain = chain.then(function(){ return dropRaw(e.id); }); });
    out.forEach(function(e){ chain = chain.then(function(){ return putRaw(e); }); });
      return chain.then(function(){
        fire();
        return { added:added, updated:kept, removed:gone.length };
      });
    });
  }

/* ---- the "@date" marker, shared so every page reads one syntax ----
     @2026-09-03                            a whole day
     @2026-09-03 14:00                      an hour from 14:00
     @2026-09-03 14:00-15:30                an interval
     @2026-09-03..2026-09-05                several whole days (through the 5th)
     @2026-09-03 14:00..2026-09-05 10:00    an interval across days

     written by hand here. The lead class is TAG_RE's, which is what keeps
     an e-mail address from looking like a date. */
  var RE_DATE = "(?:\\d{4}-\\d{2}-\\d{2}|\\d{1,2}[./]\\d{1,2}[./]\\d{4})";

    var y, m, d, p;

    else { p = s.split(/[./]/); d = +p[0]; m = +p[1]; y = +p[2]; }
    if(!(y > 0 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;

    if(!s) return null;

/* ============================================================
   window.ScuLaGeo - the "^@" location marker
   ------------------------------------------------------------
   "^@Castelul Peles", "^@44.4268, 26.1025", "^@Strada Lipscani 12,
   Bucuresti" - a place flagged in markdown, the way "@date" flags a day
   for the calendar. The syntax lives here, in the block every page
   carries, and not in the page that writes it, so index.html (which
   paints the markers and sends them) and map.html (which draws them)
   can never drift apart - docs/FEATURES.md § S.
   ============================================================ */
(function(){
  var KEY = "scula:map:payload";

  // "^@" then the place, to the end of the line. A "#tag" ends it - the tag
  // belongs to the line, not to the address - and so does a "<": by the time
  // index.html runs this over a rendered line, every "<" in it is a tag that
  // line's own rendering produced. The lead class is TAG_RE's, so "a^@b"
  // mid-word is not a marker, and one inside `inline code` (which by then
  // follows "`" or ">") is left alone.
  //
  // The tail is a lookahead, not part of the match, so the space *before* a
  // trailing "#tag" survives: without it the pill this becomes would put the
  // tag straight after a ">", which is exactly the lead TAG_RE refuses, and
  // the tag would stop being one. "m", because applyInline() is handed whole
  // paragraphs and a line start inside one still starts a marker.
  function markRe(){ return /(^|[\s(\[{])\^@[ \t]*([^\n<#]*?)(?=[ \t]*(?:[<#]|$))/gm; }

  // "44.4268, 26.1025" or "44.4268N 26.1025E" -> {lat, lon}. A pair of bare
  // integers ("Sector 3, 5") is not coordinates: one of the numbers must
  // carry a decimal point, or both must carry a hemisphere letter. V is
  // Romanian for West, so it counts as one.
  function coords(s){
    var str = String(s == null ? "" : s).trim();
    var m = /^([+-]?\d{1,3}(?:\.\d+)?)\s*([NSns])?\s*[,;]\s*([+-]?\d{1,3}(?:\.\d+)?)\s*([EWVewv])?$/.exec(str)

    if(!(m[2] && m[4]) && m[1].indexOf(".") < 0 && m[3].indexOf(".") < 0) return null;

    return { lat: lat, lon: lon };
  }

  // What follows "^@" -> { query, note, lat, lon }, or null when there is
  // nothing but the marker. Everything after a "|" is a note about the
  // place rather than part of its address.
  function read(raw){

    if(bar >= 0){ note = s.slice(bar + 1).trim(); s = s.slice(0, bar); }
    s = s.replace(/[\s,;]+$/, "").trim();

    var c = coords(s);
    return { query: s, note: note, lat: c ? c.lat : null, lon: c ? c.lon : null };
  }

  // The whole thing in one call: text -> [{ place, index, length, text }],
  // the shape ScuLaCal.findMarks already returns for dates.
  function findMarks(text){
    var re = markRe(), m, out = [];
    while((m = re.exec(String(text == null ? "" : text)))){
      if(re.lastIndex === m.index) re.lastIndex++;
      var place = read(m[2]);
      if(!place) continue;
      var lead = m[1] ? m[1].length : 0;
      out.push({ place: place, index: m.index + lead, length: m[0].length - lead, text: m[0].slice(lead) });
    }

  }

    return out;
  }

  // its checkbox - what the popup shows under the name.

      if(!index[name]){ index[name] = { name: name, items: [] }; layers.push(index[name]); }
      return index[name];
    }
    lines.forEach(function(line, i){
      if(/^\s*```/.test(line)){ inCode = !inCode; return; }
      if(inCode) return;
      var h = /^(#{1,6})\s+(.*)$/.exec(line);
      if(h){
        current = h[2].replace(markRe(), "").replace(/[*_`#]+/g, "").replace(/\s+/g, " ").trim();
      }

      if(!hits.length) return;
      var name = current || fallback, tags = tagsOf(line), ctx = contextOf(line);
      hits.forEach(function(hit){
        layer(name).items.push({
          q: hit.place.query, note: hit.place.note,
          lat: hit.place.lat, lon: hit.place.lon,
          line: i, tags: tags, context: ctx
        });

      });
    });

  }

  // rather than a query string - a whole chapter's worth of places does not
  // belong in a URL, and this survives the map page being reloaded.
  function send(payload){
    try{ localStorage.setItem(KEY, JSON.stringify(payload)); return true; }catch(e){ return false; }
  }
  function received(){
    try{ var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }

  window.ScuLaGeo = {
    KEY: KEY,
    markRe: markRe,
    coords: coords,
    read: read,
    findMarks: findMarks,
    has: has,
    scan: scan,
    send: send,
    received: received
  };
})();

  let clean = body.replace(NAMED_DATE,' ');
  if (window.ScuLaCal) {
    const marks = ScuLaCal.findMarks(clean);
    marks.forEach(hit => {
      const m = hit.mark;
      const start = m.date + (m.allDay ? '' : ' ' + m.time);
      const end = (m.endDate || m.date) + (m.endTime ? ' ' + m.endTime : '');
      const interval = m.endDate !== m.date || !!m.endTime;
      if (interval && !dates.start) dates.start = start;
      if (!dates.end && (interval || m.allDay)) dates.end = end;
      if (!interval && !m.allDay && !dates.start) dates.start = start;

      if (marker) { if (!fence) fence=marker[1][0]; else if (fence===marker[1][0]) fence=''; return; }
      if (fence) return;
      const task = parseTask(ch,byBook.get(ch.workbookId),line,i);
      if (task) tasks.push(task);
    });
  });
}
function option(value,label) { const el=document.createElement('option'); el.value=value; el.textContent=label; return el; }
function fill(select,items) {
  const current=select.value;
  select.replaceChildren(...items.map(([value,label])=>option(value,label)));
  if (items.some(([value])=>value===current)) select.value=current;
}
function paintControls() {
  const scope=$('scope'), old=scope.value;
  scope.replaceChildren(option('all',t('all')));
  books.sort(order).forEach(book => {
    const group=document.createElement('optgroup'); group.label=book.name;
    group.appendChild(option('b:'+book.id,t('workbook')+' · '+book.name));
    chapters.filter(ch=>ch.workbookId===book.id).sort(order).forEach(ch=>group.appendChild(option('c:'+ch.id,t('chapter')+' · '+ch.title)));
    scope.appendChild(group);
  });
  const initial=params.get('scope');
  const available=Array.from(scope.options).map(o=>o.value);
  scope.value=scopeInitialized && available.includes(old) ? old : (available.includes(initial) ? initial : 'all');
  scopeInitialized=true;
  const ownerMap=new Map();
  tasks.flatMap(task=>task.owners).forEach(name=>{
    const key=name.normalize('NFC').toLocaleLowerCase();
    if (!ownerMap.has(key)) ownerMap.set(key,name);
  });
  const owners=Array.from(ownerMap,([key,name])=>[key,name]).sort((a,b)=>a[1].localeCompare(b[1],UI));
  fill($('owner'),[['all',t('allOwners')],['none',t('unassigned')],...owners]);
  fill($('priority'),[['all',t('allPriorities')],['none',t('noPriority')],['nice',t('nice')],['important',t('important')],['vital',t('vital')]]);
  fill($('date-filter'),[['all',t('allDates')],['overdue',t('overdue')],['today',t('today')],['next7',t('next7')],['undated',t('undated')]]);
  fill($('state-filter'),[['all',t('allStates')],...STATES.map(s=>[s,t(s)])]);
}
function dateDay(value) {
  if (!value) return '';
  const iso=value.match(/^\d{4}-\d{2}-\d{2}/);
  if (iso) return iso[0];
  const local=value.match(/^(\d{1,2})[./](\d{1,2})[./](\d{4})/);
  return local ? local[3]+'-'+local[2].padStart(2,'0')+'-'+local[1].padStart(2,'0') : '';
}
function localDay(date) { return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'); }
function dateMatches(task,filter) {
  if (filter==='all') return true;
  if (filter==='undated') return !task.dates.start && !task.dates.end;
  const day=dateDay(task.dates.end||task.dates.start);
  if (!day || task.status==='done') return false;
  const today=localDay(new Date());
  if (filter==='overdue') return !!task.dates.end && day<today;
  if (filter==='today') return day===today;
  const next=new Date(); next.setDate(next.getDate()+7);
  return day>today && day<=localDay(next);
}
function filterTasks() {
  const scope=$('scope').value, q=$('search').value.trim().toLocaleLowerCase(), owner=$('owner').value, priority=$('priority').value, date=$('date-filter').value, state=$('state-filter').value;
  const scoped=tasks.filter(task=>scope==='all'||(scope.startsWith('b:')&&task.workbookId===scope.slice(2))||(scope.startsWith('c:')&&task.chapterId===scope.slice(2)));
  visible=scoped.filter(task =>
    (!q || [task.title,task.book,task.chapter,...task.owners].join(' ').toLocaleLowerCase().includes(q)) &&
    (owner==='all'||(owner==='none'?!task.owners.length:task.owners.some(n=>n.normalize('NFC').toLocaleLowerCase()===owner))) &&
    (priority==='all'||(priority==='none'?!task.priority:task.priority===priority)) &&
    (state==='all'||task.status===state) && dateMatches(task,date));
  paintBoard(scoped.length);
}
function node(tag,className,textValue) { const el=document.createElement(tag); if(className) el.className=className; if(textValue!=null) el.textContent=textValue; return el; }
function makeCard(task) {
  const card=node('article','card'+(task.priority?' '+task.priority:''));
  card.draggable=true; card.dataset.id=task.id;
  card.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain',task.id); e.dataTransfer.effectAllowed='move'; card.classList.add('dragging'); });
  card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  card.append(node('h3','card-title',task.title),node('div','card-path',task.book+' › '+task.chapter));
  const meta=node('div','card-meta');
  task.owners.forEach(name=>meta.appendChild(node('span','pill','◉ '+name)));
  if (!task.owners.length) meta.appendChild(node('span','pill',t('unassigned')));
  if (task.priority) meta.appendChild(node('span','pill priority',t(task.priority)));
  const today=localDay(new Date());
  for (const kind of ['start','end']) if (task.dates[kind]) {
    const late=kind==='end' && task.status!=='done' && dateDay(task.dates[kind]) && dateDay(task.dates[kind])<today;
    meta.appendChild(node('span','pill'+(late?' overdue':''),kind+'@'+task.dates[kind]));
  }
  card.appendChild(meta);
  const actions=node('div','card-actions'), select=node('select');
  select.setAttribute('aria-label',t('move')+': '+task.title);
  STATES.forEach(s=>select.appendChild(option(s,t(s)))); select.value=task.status;
  select.addEventListener('change',()=>changeStatus(task,select.value));
  const link=node('a','',t('open')); link.href='index.html?chapter='+encodeURIComponent(task.chapterId)+'&line='+task.lineIndex; link.setAttribute('aria-label',t('open')+': '+task.title);
  actions.append(select,link); card.appendChild(actions);
  return card;
}
function paintBoard(scopedCount) {
  $('count').textContent=visible.length; $('count-label').textContent=t('tasks',visible.length).replace(/^\d+\s*/, '');
  $('progress').textContent=t('progress',visible.filter(task=>task.status==='done').length,visible.length);
  const board=$('board'); board.replaceChildren();
  if (!scopedCount || !visible.length) { board.appendChild(node('div','empty-page',!scopedCount?t('noTasks'):t('noMatches'))); return; }
  STATES.forEach(state => {
    const lane=node('section','lane'); lane.dataset.state=state; lane.style.setProperty('--lane-color',COLORS[state]);
    const head=node('div','lane-head'); head.append(node('h2','',t(state)),node('span','',visible.filter(task=>task.status===state).length)); lane.appendChild(head);
    const cards=node('div','lane-cards');
    const subset=visible.filter(task=>task.status===state).sort((a,b)=>{
      const p={vital:0,important:1,nice:2,'':3};
      return p[a.priority]-p[b.priority] || (dateDay(a.dates.end||a.dates.start)||'9999').localeCompare(dateDay(b.dates.end||b.dates.start)||'9999') || a.title.localeCompare(b.title,UI);
    });
    if (!subset.length) cards.appendChild(node('div','lane-empty',t('emptyLane')));
    else subset.forEach(task=>cards.appendChild(makeCard(task)));
    lane.appendChild(cards);
    lane.addEventListener('dragover',e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; lane.classList.add('over'); });
    lane.addEventListener('dragleave',e=>{ if (!lane.contains(e.relatedTarget)) lane.classList.remove('over'); });
    lane.addEventListener('drop',e=>{ e.preventDefault(); lane.classList.remove('over'); const task=tasks.find(x=>x.id===e.dataTransfer.getData('text/plain')); if(task) changeStatus(task,state); });
    board.appendChild(lane);
  });
}
function setLineStatus(line,status) {
  const match=line.match(TASK_RE); if(!match) return line;
  const body=match[4].replace(STATUS_RE,'');
  const marker=({inwork:'~inwork',onhold:'~onhold',blocked:'~blocked'})[status];
  return match[1]+(status==='done'?'[x]':'[ ]')+(match[3]||(marker?' ':''))+(marker?marker+(body?' ':''):'')+body;
}
async function writeStatus(task,status) {
  const db=await openDb();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(['chapters','pending'],'readwrite');
    const store=tx.objectStore('chapters');
    const request=store.get(task.chapterId);
    let conflict=false;
    request.onsuccess=()=>{
      const ch=request.result;
      const lines=String(ch?.content||'').split('\n');
      if (!ch || lines[task.lineIndex]!==task.line) { conflict=true; return; }
      lines[task.lineIndex]=setLineStatus(lines[task.lineIndex],status);
      ch.content=lines.join('\n'); ch.updated=Date.now();
      store.put(ch);
      tx.objectStore('pending').put({chapterId:ch.id,workbookId:ch.workbookId,content:ch.content,updated:ch.updated});
    };
    tx.oncomplete=()=>{ db.close(); conflict ? reject(new Error('conflict')) : resolve(); };
    tx.onerror=()=>{ db.close(); reject(tx.error); };
  });
}
async function changeStatus(task,status) {
  if (dbBusy || task.status===status) return;
  dbBusy=true; $('notice').textContent='';
  try {
    await writeStatus(task,status);
    try { localStorage.setItem('scula:kanban-change',JSON.stringify({chapterId:task.chapterId,lineIndex:task.lineIndex,line:task.line,status,at:Date.now()})); } catch(e) {}
    await reload(); $('notice').textContent=t('saved');
  } catch(e) { await reload(); $('notice').textContent=t('saveError'); }
  finally { dbBusy=false; }
}
async function reload() {
  try { [books,chapters]=await readAll(); loaded=true; collectTasks(); paintControls(); filterTasks(); }
  catch(e) { $('notice').textContent=t('loadError'); }
}
function repaintLanguage() {
  document.documentElement.lang=UI;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll('[data-i-placeholder]').forEach(el=>el.placeholder=t(el.dataset.iPlaceholder));
  if (loaded) { paintControls(); filterTasks(); }
}
window.addEventListener('scula-ui-lang',e=>{ UI=e.detail==='en'?'en':'ro'; repaintLanguage(); });
window.addEventListener('focus',reload);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) reload(); });
for (const id of ['scope','owner','priority','date-filter','state-filter']) $(id).addEventListener('change',filterTasks);
$('search').addEventListener('input',filterTasks);
$('refresh').addEventListener('click',reload);
$('clear').addEventListener('click',()=>{ $('search').value=''; ['scope','owner','priority','date-filter','state-filter'].forEach(id=>$(id).value='all'); filterTasks(); });
repaintLanguage(); reload();
</script>
