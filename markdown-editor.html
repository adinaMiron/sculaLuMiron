/* ── Markdown parser ──
   Single implementation shared by the live preview and the HTML export.
   Pass {forExport:true} for export: it rewrites relative image paths to
   `public/images/…` and recognises a bare image-path line as a standalone
   <img>. Preview (the default, forExport:false) leaves paths as-authored. */
function resolveImageSrc(src, forExport) {
  if (!forExport) return src;
  const isAbsolute = /^(https?:\/\/|\/|data:)/i.test(src);
  return isAbsolute ? src : 'public/images/' + src;
}

function applyInline(text, opts) {
  const forExport = !!(opts && opts.forExport);
  return text
    .replace(/!\[([^\]]*)\]\(([^)\s"]+)(?:\s+"([^"]*)")?\)/g,
      (_, alt, src, title) => `<img src="${resolveImageSrc(src, forExport)}" alt="${alt}"${title ? ` title="${title}"` : ''}>`)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function parseMarkdown(md, opts) {
  const forExport = !!(opts && opts.forExport);
  let html = md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html = html.replace(/&lt;(span\s[^&]*?)&gt;([\s\S]*?)&lt;\/span&gt;/g,
    (_, attrs, content) => `<span ${attrs}>${content}</span>`);

  const lines = html.split('\n');
  const out = []; let inUL = false; let inOL = false;
  let inCode = false; let codeLang = ''; let codeLines = [];
  let tableBuffer = [];

  function flushTable() {
    if (!tableBuffer.length) return;
    const rows = tableBuffer;
    tableBuffer = [];
    if (rows.length < 2) { rows.forEach(r => out.push(`<p>${r}</p>`)); return; }
    const headers = rows[0].split('|').map(c => c.trim()).filter((_,i,a) => i>0 && i<a.length-1);
    const sepRow = rows[1].split('|').map(c => c.trim()).filter((_,i,a) => i>0 && i<a.length-1);
    const isSep = sepRow.every(c => /^:?-+:?$/.test(c));
    if (!isSep) { rows.forEach(r => out.push(`<p>${applyInline(r, opts)}</p>`)); return; }
    const aligns = sepRow.map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : 'left');
    out.push('<table>');
    out.push('<thead><tr>' + headers.map((h,i) => `<th style="text-align:${aligns[i]}">${applyInline(h, opts)}</th>`).join('') + '</tr></thead>');
    if (rows.length > 2) {
      out.push('<tbody>');
      for (let r = 2; r < rows.length; r++) {
        const cells = rows[r].split('|').map(c => c.trim()).filter((_,i,a) => i>0 && i<a.length-1);
        out.push('<tr>' + cells.map((c,i) => `<td style="text-align:${aligns[i]||'left'}">${applyInline(c, opts)}</td>`).join('') + '</tr>');
      }
      out.push('</tbody>');
    }
    out.push('</table>');
  }

  for (const line of lines) {
    // fenced code block
    if (line.match(/^```/)) {
      if (!inCode) {
        flushTable();
        if (inUL) { out.push('</ul>'); inUL = false; }
        if (inOL) { out.push('</ol>'); inOL = false; }
        inCode = true;
        codeLang = line.slice(3).trim();
        codeLines = [];
      } else {
        out.push(`<pre><code${codeLang ? ` class="language-${codeLang}"` : ''}>${codeLines.join('\n')}</code></pre>`);
        inCode = false; codeLines = []; codeLang = '';
      }
      continue;
    }
    if (inCode) { codeLines.push(line); continue; }

    // table row
    if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
      if (inUL) { out.push('</ul>'); inUL = false; }
      if (inOL) { out.push('</ol>'); inOL = false; }
      tableBuffer.push(line.trim());
      continue;
    } else {
      flushTable();
    }

    const hm = line.match(/^(#{1,6})\s+(.*)/);
    if (hm) {
      if (inUL) { out.push('</ul>'); inUL = false; }
      if (inOL) { out.push('</ol>'); inOL = false; }
      out.push(`<h${hm[1].length}>${applyInline(hm[2], opts)}</h${hm[1].length}>`);
      continue;
    }
    const olm = line.match(/^\d+\.\s+(.*)/);
    if (olm) {
      if (inUL) { out.push('</ul>'); inUL = false; }
      if (!inOL) { out.push('<ol>'); inOL = true; }
      out.push(`<li>${applyInline(olm[1], opts)}</li>`);
      continue;
    }
    const lm = line.match(/^[-*+]\s+(.*)/);
    if (lm) {
      if (inOL) { out.push('</ol>'); inOL = false; }
      if (!inUL) { out.push('<ul>'); inUL = true; }
      out.push(`<li>${applyInline(lm[1], opts)}</li>`);
      continue;
    }
    if (inUL) { out.push('</ul>'); inUL = false; }
    if (inOL) { out.push('</ol>'); inOL = false; }
    if (forExport) {
      const imgPathMatch = line.trim().match(/^([^\s<>&]+\.(png|jpe?g|gif|webp|svg|avif|bmp|ico|tiff?))\s*$/i);
      if (imgPathMatch) {
        const src = imgPathMatch[1];
        out.push(`<p><img src="${resolveImageSrc(src, forExport)}" alt="${src}"></p>`);
        continue;
      }
    }
    out.push(line.trim() === '' ? '<br>' : `<p>${applyInline(line, opts)}</p>`);
  }
  flushTable();
  if (inCode) out.push(`<pre><code>${codeLines.join('\n')}</code></pre>`);
  if (inUL) out.push('</ul>');
  if (inOL) out.push('</ol>');
  return out.join('\n');
}

function updatePreview() {
  preview.innerHTML = parseMarkdown(editor.value);
  updateNav();
}

/* ── Navigation panel ── */
function updateNav() {
  const navTree = document.getElementById('nav-tree');
  const lines = editor.value.split('\n');
  const headings = [];
  let inCode = false;
  let slugCount = {};

  for (const line of lines) {
    if (line.match(/^```/)) { inCode = !inCode; continue; }
    if (inCode) continue;
    const m = line.match(/^(#{1,6})\s+(.*)/);
    if (m) {
      const level = m[1].length;
      const raw = m[2].trim();
      // strip inline markdown for display
      const text = raw
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1');
      // build a unique slug for anchor linking in preview
      let slug = raw.toLowerCase().replace(/[^\w\s-]/g,'').replace(/\s+/g,'-');
      slugCount[slug] = (slugCount[slug] || 0) + 1;
      if (slugCount[slug] > 1) slug += '-' + (slugCount[slug] - 1);
      headings.push({ level, text, slug });
    }
  }

  if (!headings.length) {
    navTree.innerHTML = '<div class="nav-empty">' + t('noHeadingsYet') + '</div>';
    return;
  }

  // bullet characters per level
  const bullets = ['', '◆', '◇', '▸', '▹', '·', '·'];

  navTree.innerHTML = '';
  headings.forEach(({ level, text, slug }) => {
    const item = document.createElement('div');
    item.className = `nav-item nav-h${level}`;
    item.title = text;

    const bullet = document.createElement('span');
    bullet.className = 'nav-bullet';
    bullet.textContent = bullets[level];

    const label = document.createElement('span');
    label.className = 'nav-label';
    label.textContent = text;

    item.appendChild(bullet);
    item.appendChild(label);

    // clicking scrolls the preview to that heading
    item.addEventListener('click', () => {
      // On mobile, the preview may be hidden — switch to it and close the panel
      if (isMobile()) {
        setView('preview');
        document.getElementById('nav-panel').classList.add('collapsed');
        document.getElementById('btn-nav').classList.remove('active');
        syncBackdrop();
      }
      // find the heading in the preview by matching text content
      const allHeadings = preview.querySelectorAll('h1,h2,h3,h4,h5,h6');
      for (const el of allHeadings) {
        if (el.textContent.trim() === text) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // briefly highlight
          el.style.transition = 'background 0.2s';
          el.style.background = '#C1BB4530';
          setTimeout(() => { el.style.background = ''; }, 800);
          break;
        }
      }
      // highlight active nav item
      navTree.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
    });

    navTree.appendChild(item);
  });
}

function updateStatus() {
  const text = editor.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('stat-words').textContent = t('statWords', words);
  document.getElementById('stat-lines').textContent = t('statLines', text.split('\n').length);
  document.getElementById('stat-chars').textContent = t('statChars', text.length);
}

/* ============================================================
   Workbooks — a workbook holds chapters; one chapter is one
   markdown file, the way OneNote holds pages in a notebook.

   IndexedDB (`scula-md`) is the source of truth and works on
   every device, phones included. Where a default folder exists
   (desktop, see docs/FEATURES.md § D) the same chapters are
   mirrored to <folder>/markdown/<workbook>/<chapter>.md, and
   every record keeps the folder + file name it owns — that
   record *is* the correspondence between the UI and the folder.

   Full description: docs/FEATURES.md § E.
   ============================================================ */
const WB_DB = 'scula-md', WB_VER = 1;
const WB_BOOKS = 'workbooks', WB_CHAPTERS = 'chapters', WB_META = 'meta';

var wbBooted = false;        // var: applyUILang() reads it before this runs
let wbBooks = [];            // [{ id, name, folder, created, updated, order }]
let wbChapters = [];         // [{ id, workbookId, title, file, content, … }]
let wbCurrentId = null;      // open chapter, or null for a loose file
let wbDirty = false;
let wbSaveTimer = 0;
const wbOpenBooks = new Set();   // which workbooks are expanded in the panel

/* ── IndexedDB plumbing ── */
function wbDb() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(WB_DB, WB_VER); } catch (e) { rej(e); return; }
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(WB_BOOKS)) db.createObjectStore(WB_BOOKS, { keyPath: 'id' });
      if (!db.objectStoreNames.contains(WB_CHAPTERS)) {
        db.createObjectStore(WB_CHAPTERS, { keyPath: 'id' }).createIndex('byWorkbook', 'workbookId');
      }
      if (!db.objectStoreNames.contains(WB_META)) db.createObjectStore(WB_META);
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function wbTx(store, mode, run) {
  return wbDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const req = run(tx.objectStore(store));
    tx.oncomplete = () => { db.close(); res(req ? req.result : undefined); };
    tx.onerror = () => { db.close(); rej(tx.error); };
    tx.onabort = () => { db.close(); rej(tx.error); };
  }));
}
const wbAll = store => wbTx(store, 'readonly', s => s.getAll());
const wbPut = (store, v) => wbTx(store, 'readwrite', s => s.put(v));
const wbDrop = (store, k) => wbTx(store, 'readwrite', s => s.delete(k));
// The meta store has no keyPath — put(value, key), get(key).
const wbMetaGet = k => wbTx(WB_META, 'readonly', s => s.get(k));
const wbMetaSet = (k, v) => wbTx(WB_META, 'readwrite', s => s.put(v, k));

async function wbPersist(store, value) {
  try { await wbPut(store, value); return true; }
  catch (e) { wbSay(t('wbStoreFailed'), true); return false; }
}

/* ── Small helpers ── */
function wbNewId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function wbByOrder(a, b) { return (a.order || 0) - (b.order || 0) || (a.created || 0) - (b.created || 0); }
function wbBook(id) { return wbBooks.find(b => b.id === id) || null; }
function wbChapter(id) { return wbChapters.find(c => c.id === id) || null; }
function wbChaptersOf(id) { return wbChapters.filter(c => c.workbookId === id).sort(wbByOrder); }

// A name every file system accepts. Romanian diacritics survive — they are
// valid in file names everywhere the apps run, and stripping them would make
// the folder unrecognisable next to the UI it mirrors.
function wbSlug(name, fallback) {
  let s = String(name || '').trim()
    .replace(/[\\/:*?"<>|]/g, '-')
    .replace(/[\u0000-\u001f\u007f]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-{2,}/g, '-')
    .replace(/^[-.]+|[-.]+$/g, '');
  if (s.length > 60) s = s.slice(0, 60).replace(/-+$/, '');
  return s || fallback;
}
function wbUniqueFolder(name, exceptId) {
  const base = wbSlug(name, t('untitledWorkbook'));
  const taken = new Set(wbBooks.filter(b => b.id !== exceptId).map(b => b.folder.toLowerCase()));
  let n = base, i = 1;
  while (taken.has(n.toLowerCase())) n = base + '-' + (++i);
  return n;
}
function wbUniqueFile(workbookId, title, exceptId) {
  const base = wbSlug(title, t('untitledChapter'));
  const taken = new Set(wbChapters.filter(c => c.workbookId === workbookId && c.id !== exceptId)
                                  .map(c => c.file.toLowerCase()));
  let n = base + '.md', i = 1;
  while (taken.has(n.toLowerCase())) n = base + '-' + (++i) + '.md';
  return n;
}
function wbSay(msg, alsoToast) {
  const el = document.getElementById('stat-wb');
  if (el) el.textContent = msg || '';
  if (alsoToast && msg && typeof ScuLaFolder !== 'undefined') ScuLaFolder.toast(msg);
}
function wbGuessTitle() {
  const m = editor.value.match(/^#{1,3}\s+(.+)$/m);
  if (m) return m[1].trim().slice(0, 80);
  const base = (document.getElementById('current-file').textContent || '').replace(/\.(md|txt)$/i, '');
  return base && base !== 'untitled' ? base : t('defaultChapterName');
}

/* ── The folder mirror ──
   Only the "folder" route owns a directory we can write into. On the share
   and download routes the chapter still lives in IndexedDB, and a person who
   wants the file in their hands uses exportChapter() — docs/FEATURES.md § D. */
function wbFolderMode() {
  return typeof ScuLaFolder !== 'undefined' && ScuLaFolder.mode() === 'folder';
}
async function wbMirrorWrite(book, chapter, text) {
  if (!wbFolderMode()) return null;
  try {
    const md = await ScuLaFolder.dir(true);                     // <root>/markdown
    if (!md) return null;
    const bookDir = await md.getDirectoryHandle(book.folder, { create: true });
    const fh = await bookDir.getFileHandle(chapter.file, { create: true });
    const w = await fh.createWritable();
    await w.write(new Blob([text], { type: 'text/markdown' }));
    await w.close();
    return ScuLaFolder.name() + '/' + ScuLaFolder.subdir() + '/' + book.folder + '/' + chapter.file;
  } catch (e) { return null; }
}
// Best effort, and never recursive: only files this app knows it wrote are
// removed, and an empty workbook folder is dropped only if the FS agrees it
// is empty. Nothing a person put there by hand is ever deleted.
async function wbMirrorRemove(folder, file) {
  if (!wbFolderMode()) return;
  try {
    const md = await ScuLaFolder.dir(true);
    if (!md) return;
    const bookDir = await md.getDirectoryHandle(folder);
    if (file) await bookDir.removeEntry(file);
    else await md.removeEntry(folder);
  } catch (e) { /* not there, or not empty — leave it alone */ }
}

/* ── Panel rendering ── */
function wbActBtn(label, title, fn) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'wb-act';
  b.textContent = label;
  b.title = title;
  b.setAttribute('aria-label', title);
  b.addEventListener('click', ev => { ev.stopPropagation(); fn(); });
  return b;
}
function renderWorkbooks() {
  const tree = document.getElementById('wb-tree');
  if (!tree) return;
  tree.textContent = '';

  if (!wbBooks.length) {
    const empty = document.createElement('div');
    empty.className = 'wb-empty';
    empty.textContent = t('wbEmpty');
    tree.appendChild(empty);
  }

  wbBooks.slice().sort(wbByOrder).forEach(book => {
    const chapters = wbChaptersOf(book.id);
    const open = wbOpenBooks.has(book.id);

    const wrap = document.createElement('div');
    wrap.className = 'wb-book' + (open ? ' open' : '');

    const row = document.createElement('div');
    row.className = 'wb-book-row';
    row.title = book.folder + '/';
    row.addEventListener('click', () => {
      if (open) wbOpenBooks.delete(book.id); else wbOpenBooks.add(book.id);
      renderWorkbooks();
    });

    const twist = document.createElement('span');
    twist.className = 'wb-twist';
    twist.textContent = open ? '▼' : '▶';
    const name = document.createElement('span');
    name.className = 'wb-book-name';
    name.textContent = '📓 ' + book.name;
    const count = document.createElement('span');
    count.className = 'wb-count';
    count.textContent = chapters.length;

    const acts = document.createElement('div');
    acts.className = 'wb-acts';
    acts.appendChild(wbActBtn('＋', t('addChapterTip'), () => newChapter(book.id)));
    acts.appendChild(wbActBtn('✎', t('renameWorkbookTip'), () => renameWorkbook(book.id)));
    acts.appendChild(wbActBtn('🗑', t('deleteWorkbookTip'), () => deleteWorkbook(book.id)));

    row.appendChild(twist); row.appendChild(name); row.appendChild(count); row.appendChild(acts);
    wrap.appendChild(row);

    const list = document.createElement('div');
    list.className = 'wb-chapters';
    if (!chapters.length) {
      const none = document.createElement('div');
      none.className = 'wb-ch-empty';
      none.textContent = t('wbNoChapters');
      list.appendChild(none);
    }
    chapters.forEach(ch => {
      const chRow = document.createElement('div');
      chRow.className = 'wb-ch-row' + (ch.id === wbCurrentId ? ' current' : '');
      chRow.title = book.folder + '/' + ch.file;
      chRow.addEventListener('click', () => openChapter(ch.id));

      const chName = document.createElement('span');
      chName.className = 'wb-ch-name';
      chName.textContent = '📄 ' + ch.title;

      const chActs = document.createElement('div');
      chActs.className = 'wb-acts';
      chActs.appendChild(wbActBtn('✎', t('renameChapterTip'), () => renameChapter(ch.id)));
      chActs.appendChild(wbActBtn('⇪', t('exportChapterTip'), () => exportChapter(ch.id)));
      chActs.appendChild(wbActBtn('🗑', t('deleteChapterTip'), () => deleteChapter(ch.id)));

      chRow.appendChild(chName); chRow.appendChild(chActs);
      list.appendChild(chRow);
    });
    wrap.appendChild(list);
    tree.appendChild(wrap);
  });

  paintWorkbookWhere();
  paintWorkbookCrumb();
}
function paintWorkbookWhere() {
  const el = document.getElementById('wb-where');
  if (!el) return;
  el.textContent = wbFolderMode()
    ? '📂 ' + ScuLaFolder.name() + '/' + ScuLaFolder.subdir() + '/'
    : t('wbLocalOnly');
}
function paintWorkbookCrumb() {
  const crumb = document.getElementById('wb-crumb');
  if (!crumb) return;
  const ch = wbChapter(wbCurrentId);
  const book = ch ? wbBook(ch.workbookId) : null;
  if (ch && book) {
    crumb.hidden = false;
    crumb.textContent = '📓 ' + book.name + ' › ' + ch.title;
    crumb.title = book.folder + '/' + ch.file;
  } else {
    crumb.hidden = true;
    crumb.textContent = '';
  }
}

/* ── Workbook / chapter operations ── */
async function createWorkbook() {
  const name = (prompt(t('promptNewWorkbook'), t('defaultWorkbookName')) || '').trim();
  if (!name) return null;
  const book = {
    id: wbNewId('wb_'), name, folder: wbUniqueFolder(name),
    created: Date.now(), updated: Date.now(), order: wbBooks.length
  };
  wbBooks.push(book);
  if (!await wbPersist(WB_BOOKS, book)) { wbBooks.pop(); return null; }
  wbOpenBooks.add(book.id);
  renderWorkbooks();
  wbSay(t('workbookCreated', book.name));
  return book;
}

async function renameWorkbook(id) {
  const book = wbBook(id);
  if (!book) return;
  const name = (prompt(t('promptRenameWorkbook'), book.name) || '').trim();
  if (!name || name === book.name) return;
  const oldFolder = book.folder;
  book.name = name;
  book.folder = wbUniqueFolder(name, book.id);
  book.updated = Date.now();
  if (!await wbPersist(WB_BOOKS, book)) return;
  if (book.folder !== oldFolder && wbFolderMode()) {
    for (const ch of wbChaptersOf(book.id)) {
      await wbMirrorWrite(book, ch, ch.content || '');
      await wbMirrorRemove(oldFolder, ch.file);
    }
    await wbMirrorRemove(oldFolder, null);
  }
  renderWorkbooks();
}

async function deleteWorkbook(id) {
  const book = wbBook(id);
  if (!book) return;
  if (!confirm(t('confirmDeleteWorkbook', book.name))) return;
  const chapters = wbChaptersOf(book.id);
  for (const ch of chapters) {
    try { await wbDrop(WB_CHAPTERS, ch.id); } catch (e) {}
    await wbMirrorRemove(book.folder, ch.file);
  }
  await wbMirrorRemove(book.folder, null);
  try { await wbDrop(WB_BOOKS, book.id); } catch (e) {}
  wbChapters = wbChapters.filter(c => c.workbookId !== book.id);
  wbBooks = wbBooks.filter(b => b.id !== book.id);
  wbOpenBooks.delete(book.id);
  if (chapters.some(c => c.id === wbCurrentId)) detachChapter();
  renderWorkbooks();
  wbSay(t('wbRemoved'));
}

async function newChapter(workbookId) {
  const book = wbBook(workbookId);
  if (!book) return;
  const title = (prompt(t('promptNewChapter'), t('defaultChapterName')) || '').trim();
  if (!title) return;
  if (!canLeaveEditor()) return;
  await flushChapter();
  const ch = {
    id: wbNewId('ch_'), workbookId: book.id, title,
    file: wbUniqueFile(book.id, title), content: '',
    created: Date.now(), updated: Date.now(), order: wbChaptersOf(book.id).length
  };
  wbChapters.push(ch);
  if (!await wbPersist(WB_CHAPTERS, ch)) { wbChapters.pop(); return; }
  wbOpenBooks.add(book.id);
  loadChapterIntoEditor(ch);
  await wbMirrorWrite(book, ch, '');
}

function loadChapterIntoEditor(ch) {
  wbCurrentId = ch.id;
  wbDirty = false;
  clearTimeout(wbSaveTimer);
  editor.value = ch.content || '';
  document.getElementById('current-file').textContent = ch.file;
  updatePreview(); updateStatus(); updateNav();
  renderWorkbooks();
  wbMetaSet('last', ch.id).catch(() => {});
  wbSay(t('chapterOpened', ch.title));
}

async function openChapter(id) {
  const ch = wbChapter(id);
  if (!ch || ch.id === wbCurrentId) return;
  if (!canLeaveEditor()) return;
  await flushChapter();
  loadChapterIntoEditor(ch);
  if (isSmallScreen()) closeAllPanels();
}

async function renameChapter(id) {
  const ch = wbChapter(id);
  if (!ch) return;
  const title = (prompt(t('promptRenameChapter'), ch.title) || '').trim();
  if (!title || title === ch.title) return;
  const book = wbBook(ch.workbookId);
  const oldFile = ch.file;
  ch.title = title;
  ch.file = wbUniqueFile(ch.workbookId, title, ch.id);
  ch.updated = Date.now();
  if (!await wbPersist(WB_CHAPTERS, ch)) return;
  if (book && ch.file !== oldFile && wbFolderMode()) {
    await wbMirrorWrite(book, ch, ch.content || '');
    await wbMirrorRemove(book.folder, oldFile);
  }
  if (ch.id === wbCurrentId) document.getElementById('current-file').textContent = ch.file;
  renderWorkbooks();
}

async function deleteChapter(id) {
  const ch = wbChapter(id);
  if (!ch) return;
  if (!confirm(t('confirmDeleteChapter', ch.title))) return;
  const book = wbBook(ch.workbookId);
  try { await wbDrop(WB_CHAPTERS, ch.id); } catch (e) {}
  if (book) await wbMirrorRemove(book.folder, ch.file);
  wbChapters = wbChapters.filter(c => c.id !== ch.id);
  if (ch.id === wbCurrentId) detachChapter();
  renderWorkbooks();
  wbSay(t('wbRemoved'));
}

// Hands one chapter out through the shared route: the markdown folder on
// desktop, the OS share sheet on a phone, a download otherwise.
function exportChapter(id) {
  const ch = wbChapter(id);
  if (!ch) return;
  const book = wbBook(ch.workbookId);
  const name = (book ? book.folder + '-' : '') + ch.file;
  ScuLaFolder.save(name, new Blob([ch.content || ''], { type: 'text/markdown' }));
}

async function syncAllToFolder() {
  if (!wbFolderMode()) { ScuLaFolder.chooser(); return; }
  await flushChapter();
  let n = 0;
  for (const book of wbBooks) {
    for (const ch of wbChaptersOf(book.id)) {
      if (await wbMirrorWrite(book, ch, ch.content || '')) n++;
    }
  }
  wbSay(t('wbSynced', n), true);
}

/* ── Autosave: the open chapter is written back to IndexedDB as you type,
   so nothing is lost on any device. Disk mirroring stays on explicit saves,
   which is where a permission prompt is allowed to happen. ── */
function scheduleAutosave() {
  if (!wbCurrentId) return;
  wbDirty = true;
  wbSay(t('wbEditing'));
  clearTimeout(wbSaveTimer);
  wbSaveTimer = setTimeout(() => { flushChapter(); }, 800);
}
async function flushChapter() {
  clearTimeout(wbSaveTimer);
  if (!wbCurrentId || !wbDirty) return;
  const ch = wbChapter(wbCurrentId);
  if (!ch) { wbDirty = false; return; }
  ch.content = editor.value;
  ch.updated = Date.now();
  wbDirty = false;
  if (await wbPersist(WB_CHAPTERS, ch)) wbSay(t('wbAutosaved'));
}
function detachChapter() {
  clearTimeout(wbSaveTimer);
  wbCurrentId = null;
  wbDirty = false;
  wbMetaSet('last', '').catch(() => {});
  wbSay('');
  renderWorkbooks();
}
// A chapter is always safe to leave (autosave already stored it); a loose
// file with text in it is not.
function canLeaveEditor() {
  if (wbCurrentId) return true;
  if (!editor.value.trim()) return true;
  return confirm(t('confirmLeaveUnsaved'));
}

/* ── Saving into a workbook ── */
async function saveToWorkbook() {
  if (!wbCurrentId) { openWorkbookModal(); return; }
  const ch = wbChapter(wbCurrentId);
  const book = ch && wbBook(ch.workbookId);
  if (!ch || !book) { detachChapter(); openWorkbookModal(); return; }
  clearTimeout(wbSaveTimer);
  ch.content = editor.value;
  ch.updated = Date.now();
  wbDirty = false;
  if (!await wbPersist(WB_CHAPTERS, ch)) return;
  const path = await wbMirrorWrite(book, ch, ch.content);
  wbSay(path ? t('wbSavedTo', path) : t('wbSavedLocal'), true);
  renderWorkbooks();
}

function openWorkbookModal() {
  const sel = document.getElementById('wb-select');
  sel.textContent = '';
  wbBooks.slice().sort(wbByOrder).forEach(b => {
    const o = document.createElement('option');
    o.value = b.id; o.textContent = b.name;
    sel.appendChild(o);
  });
  const fresh = document.createElement('option');
  fresh.value = '__new__'; fresh.textContent = t('optNewWorkbook');
  sel.appendChild(fresh);

  const current = wbChapter(wbCurrentId);
  sel.value = current ? current.workbookId : (wbBooks.length ? sel.options[0].value : '__new__');
  document.getElementById('wb-new-name').value = '';
  document.getElementById('wb-chapter-title').value = current ? current.title : wbGuessTitle();
  onWorkbookSelectChange();
  if (current) document.getElementById('wb-chapter-select').value = current.id;
  onChapterSelectChange();
  document.getElementById('workbook-modal').classList.add('open');
  setTimeout(() => {
    const focusNew = sel.value === '__new__';
    document.getElementById(focusNew ? 'wb-new-name' : 'wb-chapter-title').focus();
  }, 40);
}
function closeWorkbookModal() { document.getElementById('workbook-modal').classList.remove('open'); }

function onWorkbookSelectChange() {
  const sel = document.getElementById('wb-select');
  const isNew = sel.value === '__new__';
  document.getElementById('wb-new-field').hidden = !isNew;

  const chSel = document.getElementById('wb-chapter-select');
  chSel.textContent = '';
  const fresh = document.createElement('option');
  fresh.value = '__new__'; fresh.textContent = t('optNewChapter');
  chSel.appendChild(fresh);
  if (!isNew) {
    wbChaptersOf(sel.value).forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.title;
      chSel.appendChild(o);
    });
  }
  chSel.value = '__new__';
  onChapterSelectChange();
}
function onChapterSelectChange() {
  const chSel = document.getElementById('wb-chapter-select');
  document.getElementById('wb-title-field').hidden = chSel.value !== '__new__';
  paintWorkbookPathHint();
}
function paintWorkbookPathHint() {
  const hint = document.getElementById('wb-path-hint');
  if (!hint) return;
  const sel = document.getElementById('wb-select');
  const chSel = document.getElementById('wb-chapter-select');
  const book = sel.value === '__new__' ? null : wbBook(sel.value);
  const folder = book ? book.folder
    : wbSlug(document.getElementById('wb-new-name').value, t('untitledWorkbook'));
  const chosen = chSel.value === '__new__' ? null : wbChapter(chSel.value);
  const file = chosen ? chosen.file
    : wbSlug(document.getElementById('wb-chapter-title').value, t('untitledChapter')) + '.md';
  const sub = typeof ScuLaFolder !== 'undefined' ? ScuLaFolder.subdir() : 'markdown';
  hint.textContent = t('wbPathHint', sub + '/' + folder + '/' + file);
}

async function confirmSaveToWorkbook() {
  const sel = document.getElementById('wb-select');
  let book;
  if (sel.value === '__new__') {
    const name = document.getElementById('wb-new-name').value.trim();
    if (!name) { alert(t('needWorkbookName')); return; }
    book = {
      id: wbNewId('wb_'), name, folder: wbUniqueFolder(name),
      created: Date.now(), updated: Date.now(), order: wbBooks.length
    };
    wbBooks.push(book);
    if (!await wbPersist(WB_BOOKS, book)) { wbBooks.pop(); return; }
  } else {
    book = wbBook(sel.value);
    if (!book) return;
  }

  const chSel = document.getElementById('wb-chapter-select');
  let ch;
  if (chSel.value === '__new__') {
    const title = document.getElementById('wb-chapter-title').value.trim();
    if (!title) { alert(t('needChapterTitle')); return; }
    ch = {
      id: wbNewId('ch_'), workbookId: book.id, title,
      file: wbUniqueFile(book.id, title), content: editor.value,
      created: Date.now(), updated: Date.now(), order: wbChaptersOf(book.id).length
    };
    wbChapters.push(ch);
    if (!await wbPersist(WB_CHAPTERS, ch)) { wbChapters.pop(); return; }
  } else {
    ch = wbChapter(chSel.value);
    if (!ch) return;
    ch.content = editor.value;
    ch.updated = Date.now();
    if (!await wbPersist(WB_CHAPTERS, ch)) return;
  }

  clearTimeout(wbSaveTimer);
  wbCurrentId = ch.id;
  wbDirty = false;
  wbOpenBooks.add(book.id);
  document.getElementById('current-file').textContent = ch.file;
  wbMetaSet('last', ch.id).catch(() => {});
  closeWorkbookModal();
  renderWorkbooks();
  const path = await wbMirrorWrite(book, ch, ch.content);
  wbSay(path ? t('wbSavedTo', path) : t('wbSavedLocal'), true);
}

/* ── Boot: load the tree, then reopen whatever was last edited ── */
async function loadWorkbooks() {
  try {
    const [books, chapters] = await Promise.all([wbAll(WB_BOOKS), wbAll(WB_CHAPTERS)]);
    wbBooks = (books || []).sort(wbByOrder);
    wbChapters = (chapters || []).sort(wbByOrder);
  } catch (e) { wbBooks = []; wbChapters = []; }
  wbBooted = true;
  renderWorkbooks();
  // The stored folder handle reloads asynchronously and the shared block
  // fires no event for it, so the "where do files go" line has to wait.
  ScuLaFolder.ready.then(paintWorkbookWhere, paintWorkbookWhere);

  let last = null;
  try { last = await wbMetaGet('last'); } catch (e) {}
  const ch = last ? wbChapter(last) : null;
  // Only resume into an untouched editor — never overwrite typing that
  // started while IndexedDB was still opening.
  if (ch && !editor.value.trim()) {
    wbOpenBooks.add(ch.workbookId);
    loadChapterIntoEditor(ch);
    wbSay(t('wbRestored', ch.title));
  }
}
window.addEventListener('scula-folder', paintWorkbookWhere);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushChapter(); });
window.addEventListener('beforeunload', () => { flushChapter(); });

/* ── File operations ── */
function newFile() {
  if (wbCurrentId) flushChapter();
  else if (editor.value && !confirm(t('confirmDiscard'))) return;
  editor.value = '';
  detachChapter();
  document.getElementById('current-file').textContent = 'untitled.md';
  updatePreview(); updateStatus();
}
function openFile() { document.getElementById('file-input').click(); }
function handleFileOpen(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    editor.value = e.target.result;
    detachChapter();
    document.getElementById('current-file').textContent = file.name;
    updatePreview(); updateStatus();
  };
  reader.readAsText(file);
  event.target.value = '';
}

function importDocx() {
  if (!window.mammoth) {
    alert(t('mammothNotLoaded'));
    return;
  }
  document.getElementById('docx-input').click();
}

function handleDocxImport(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const arrayBuffer = e.target.result;
      const result = await mammoth.convertToHtml({ arrayBuffer });

      // Convert the HTML output to Markdown
      const md = htmlToMarkdown(result.value);

      if (editor.value.trim() && !confirm(t('confirmReplace'))) {
        event.target.value = '';
        return;
      }

      editor.value = md;
      const mdName = file.name.replace(/\.docx$/i, '.md');
      detachChapter();
      document.getElementById('current-file').textContent = mdName;
      updatePreview(); updateStatus();

      if (result.messages && result.messages.length) {
        const warnings = result.messages.filter(m => m.type === 'warning');
        if (warnings.length) console.warn('DOCX import warnings:', warnings);
      }
    } catch (err) {
      alert(t('importFailed', err.message));
      console.error(err);
    }
    event.target.value = '';
  };
  reader.readAsArrayBuffer(file);
}

function htmlToMarkdown(html) {
  // Use a temporary DOM element to parse the HTML
  const tmp = document.createElement('div');
  tmp.innerHTML = html;

  function processNode(node, listCtx) {
    if (node.nodeType === Node.TEXT_NODE) {
      return node.textContent;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return '';

    const tag = node.tagName.toLowerCase();
    const children = () => Array.from(node.childNodes).map(n => processNode(n, listCtx)).join('');

    switch (tag) {
      case 'h1': return '\n# ' + children().trim() + '\n';
      case 'h2': return '\n## ' + children().trim() + '\n';
      case 'h3': return '\n### ' + children().trim() + '\n';
      case 'h4': return '\n#### ' + children().trim() + '\n';
      case 'h5': return '\n##### ' + children().trim() + '\n';
      case 'h6': return '\n###### ' + children().trim() + '\n';

      case 'p': {
        const inner = children().trim();
        return inner ? '\n' + inner + '\n' : '';
      }

      case 'strong': case 'b': return '**' + children() + '**';
      case 'em':     case 'i': return '*' + children() + '*';
      case 'code':             return '`' + children() + '`';

      case 'pre': {
        const codeEl = node.querySelector('code');
        const lang = (codeEl && codeEl.className.match(/language-(\w+)/))?.[1] || '';
        const content = codeEl ? codeEl.textContent : node.textContent;
        return '\n```' + lang + '\n' + content + '\n```\n';
      }

      case 'a': {
        const href = node.getAttribute('href') || '';
        const text = children().trim() || href;
        return `[${text}](${href})`;
      }

      case 'img': {
        const src  = node.getAttribute('src') || '';
        const alt  = node.getAttribute('alt') || '';
        return `![${alt}](${src})`;
      }

      case 'br': return '\n';
      case 'hr': return '\n---\n';

      case 'ul': {
        return '\n' + Array.from(node.children).map(li => {
          const content = processNode(li, 'ul').trim();
          return '- ' + content;
        }).join('\n') + '\n';
      }

      case 'ol': {
        return '\n' + Array.from(node.children).map((li, i) => {
          const content = processNode(li, 'ol').trim();
          return `${i + 1}. ` + content;
        }).join('\n') + '\n';
      }

      case 'li': return children().trim();

      case 'table': {
        const rows = Array.from(node.querySelectorAll('tr'));
        if (!rows.length) return '';
        const toRow = tr => '| ' + Array.from(tr.querySelectorAll('th,td')).map(c => c.textContent.trim().replace(/\|/g, '\\|')).join(' | ') + ' |';
        const header = rows[0];
        const isHeaderRow = header.querySelector('th') !== null;
        const sep = '| ' + Array.from(header.querySelectorAll('th,td')).map(() => '---').join(' | ') + ' |';
        const dataRows = isHeaderRow ? rows.slice(1) : rows;
        const lines = [toRow(header), sep, ...dataRows.map(toRow)];
        return '\n' + lines.join('\n') + '\n';
      }

      case 'blockquote': return '\n> ' + children().trim().split('\n').join('\n> ') + '\n';

      // skip these wrapper elements, just process children
      case 'div': case 'span': case 'section':
      case 'article': case 'main': case 'header':
      case 'footer': case 'body':
        return children();

      default: return children();
    }
  }

  let md = Array.from(tmp.childNodes).map(n => processNode(n, null)).join('');

  // clean up excessive blank lines
  md = md.replace(/\n{3,}/g, '\n\n').trim();
  return md;
}
// Everything this page writes goes through the shared nav block: into
// <default folder>/markdown on desktop, the OS share sheet on a phone, or a
// download. It reports the outcome in the shared toast itself.
const saveOut = (filename, blob) => ScuLaFolder.save(filename, blob);

function saveFile() {
  const filename = document.getElementById('current-file').textContent || 'document.md';
  saveOut(filename, new Blob([editor.value], { type: 'text/markdown' }));
}

function exportHtml() {
  const mdFilename = document.getElementById('current-file').textContent || 'document.md';
  const htmlFilename = mdFilename.replace(/\.(md|txt)$/i, '') + '.html';
  const title = mdFilename.replace(/\.(md|txt)$/i, '');
  const bodyHtml = parseMarkdown(editor.value, {forExport: true});
  const fullHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title}</title>
  <style>
    body { font-family: Georgia, 'Times New Roman', serif; max-width: 800px; margin: 40px auto; padding: 0 24px; line-height: 1.8; color: #222; }
    h1, h2, h3, h4, h5, h6 { font-family: 'Trebuchet MS', sans-serif; line-height: 1.3; margin: 1.4em 0 0.5em; }
    h1 { font-size: 2em; border-bottom: 1px solid #ddd; padding-bottom: 0.3em; }
    h2 { font-size: 1.5em; border-bottom: 1px solid #eee; padding-bottom: 0.2em; }
    h3 { font-size: 1.25em; } h4 { font-size: 1.1em; } h5 { font-size: 1em; } h6 { font-size: 0.9em; color: #555; }
    p { margin: 0 0 1em; }
    ul, ol { margin: 0 0 1em 1.5em; padding: 0; }
    li { margin: 0.3em 0; }
    a { color: #4a6cf7; text-decoration: none; } a:hover { text-decoration: underline; }
    strong { font-weight: 700; }
    em { font-style: italic; }
    img { max-width: 100%; height: auto; border-radius: 4px; margin: 8px 0; }
    code { background: #f4f4f4; border: 1px solid #e0e0e0; border-radius: 3px; padding: 1px 5px; font-family: 'Courier New', monospace; font-size: 0.88em; }
    pre { background: #f6f8fa; border: 1px solid #e0e0e0; border-radius: 6px; padding: 14px 18px; overflow-x: auto; margin: 0 0 1em; }
    pre code { background: none; border: none; padding: 0; font-size: 0.9em; }
    table { border-collapse: collapse; width: 100%; margin: 0 0 1em; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; }
    th { background: #f0f0f0; font-weight: 600; }
    tr:nth-child(even) td { background: #fafafa; }
  </style>
</head>
<body>
${bodyHtml}
</body>
</html>`;
  saveOut(htmlFilename, new Blob([fullHtml], { type: 'text/html' }));
}

/* ── Table builder ── */
function openTableModal() {
  saveSelection();
  document.getElementById('table-modal').classList.add('open');
  rebuildTableGrid();
}
function closeTableModal() {
  document.getElementById('table-modal').classList.remove('open');
}
function rebuildTableGrid() {
  const rows = Math.min(20, Math.max(1, parseInt(document.getElementById('tbl-rows').value) || 1));
  const cols = Math.min(10, Math.max(1, parseInt(document.getElementById('tbl-cols').value) || 1));
  const container = document.getElementById('table-preview-grid');
  const table = document.createElement('table');
  table.className = 'tbl-builder';

  // Header row
  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  for (let c = 0; c < cols; c++) {
    const th = document.createElement('th');
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = `Header ${c + 1}`;
    inp.dataset.row = 'h';
    inp.dataset.col = c;
    th.appendChild(inp);
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  // Alignment row
  const tbody = document.createElement('tbody');
  const arow = document.createElement('tr');
  arow.className = 'align-row';
  for (let c = 0; c < cols; c++) {
    const td = document.createElement('td');
    const sel = document.createElement('select');
    sel.className = 'align-select';
    sel.dataset.col = c;
    [['left','⬅ Left'],['center','↔ Center'],['right','➡ Right']].forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l; sel.appendChild(o);
    });
    td.appendChild(sel);
    arow.appendChild(td);
  }
  tbody.appendChild(arow);

  // Data rows
  for (let r = 0; r < rows; r++) {
    const drow = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const td = document.createElement('td');
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = `Cell`;
      inp.dataset.row = r;
      inp.dataset.col = c;
      td.appendChild(inp);
      drow.appendChild(td);
    }
    tbody.appendChild(drow);
  }
  table.appendChild(tbody);
  container.innerHTML = '';
  container.appendChild(table);
}

function insertTable() {
  const rows = Math.min(20, Math.max(1, parseInt(document.getElementById('tbl-rows').value) || 1));
  const cols = Math.min(10, Math.max(1, parseInt(document.getElementById('tbl-cols').value) || 1));
  const grid = document.getElementById('table-preview-grid');

  // headers
  const headers = Array.from(grid.querySelectorAll('thead input')).map(i => i.value || i.placeholder);
  // alignments
  const aligns = Array.from(grid.querySelectorAll('.align-select')).map(s => s.value);
  // data cells
  const dataInputs = Array.from(grid.querySelectorAll('tbody tr:not(.align-row) input'));
  const dataRows = [];
  for (let r = 0; r < rows; r++) {
    dataRows.push(dataInputs.slice(r * cols, r * cols + cols).map(i => i.value || ' '));
  }

  // Build separator row with alignment markers
  const sep = aligns.map(a => a === 'center' ? ':---:' : a === 'right' ? '---:' : ':---');

  const pad = (cells) => '| ' + cells.join(' | ') + ' |';
  const lines = [
    pad(headers),
    pad(sep),
    ...dataRows.map(pad)
  ];
  closeTableModal();
  restoreSelection();
  insertAtCursor('\n' + lines.join('\n') + '\n');
}

/* ── Code block ── */
function insertCodeBlock() {
  editor.focus();
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end);
  if (sel && !sel.includes('\n')) {
    // inline code
    editor.setRangeText('`' + sel + '`', start, end, 'end');
  } else {
    // fenced code block
    const code = sel || 'your code here';
    editor.setRangeText('\n```\n' + code + '\n```\n', start, end, 'end');
  }
  updatePreview(); updateStatus();
}

/* ── Link modal ── */
function openLinkModal() {
  saveSelection();
  const sel = editor.value.substring(editor.selectionStart, editor.selectionEnd);
  if (sel) document.getElementById('link-text').value = sel;
  document.getElementById('link-modal').classList.add('open');
  document.getElementById('link-url').focus();
}
function closeLinkModal() {
  document.getElementById('link-modal').classList.remove('open');
  ['link-url','link-text','link-title'].forEach(id => document.getElementById(id).value = '');
}
function insertLink() {
  const url = document.getElementById('link-url').value.trim();
  const text = document.getElementById('link-text').value.trim() || url;
  const title = document.getElementById('link-title').value.trim();
  if (!url) { document.getElementById('link-url').focus(); return; }
  const md = title ? `[${text}](${url} "${title}")` : `[${text}](${url})`;
  closeLinkModal(); restoreSelection(); insertAtCursor(md);
}

/* ── Event listeners ── */
document.getElementById('image-modal').addEventListener('click', function(e) {
  if (e.target === this) closeImageModal();
});
document.getElementById('link-modal').addEventListener('click', function(e) {
  if (e.target === this) closeLinkModal();
});
document.getElementById('table-modal').addEventListener('click', function(e) {
  if (e.target === this) closeTableModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeImageModal(); closeLinkModal(); closeTableModal();
    if (isSmallScreen()) closeAllPanels();
  }
  if ((e.ctrlKey||e.metaKey) && e.key === '1') { e.preventDefault(); toggleNav(); }
  if ((e.ctrlKey||e.metaKey) && e.key === '2') { e.preventDefault(); toggleWorkbooks(); }
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key === 'S') { e.preventDefault(); saveFile(); }
  else if ((e.ctrlKey||e.metaKey) && e.key === 's') { e.preventDefault(); saveToWorkbook(); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'b') { e.preventDefault(); wrapSelection('**','**'); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'i') { e.preventDefault(); wrapSelection('*','*'); }
  if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); openLinkModal(); }
  if ((e.ctrlKey||e.metaKey) && e.shiftKey && e.key === 'K') { e.preventDefault(); insertCodeBlock(); }
});

updatePreview();
updateStatus();
updateNav();

/* ── Responsive initialisation ── */
function applyResponsiveDefaults() {
  if (isSmallScreen()) {
    // Panels overlay the content, so start them closed
    closeAllPanels();
  } else {
    // Desktop: workbooks and nav visible by default, image explorer closed
    ['wb-panel', 'nav-panel'].forEach(id => {
      document.getElementById(id).classList.remove('collapsed');
      document.getElementById(PANELS[id]).classList.add('active');
    });
    document.getElementById('img-panel').classList.add('collapsed');
    document.getElementById('btn-explorer').classList.remove('active');
    document.getElementById('panel-backdrop').classList.remove('show');
  }
}

setView('source');
applyResponsiveDefaults();
loadWorkbooks();

let lastSmall = isSmallScreen();
window.addEventListener('resize', () => {
  const nowSmall = isSmallScreen();
  if (nowSmall !== lastSmall) {   // only react when crossing the breakpoint
    lastSmall = nowSmall;
    applyResponsiveDefaults();
  }
  syncBackdrop();
});
