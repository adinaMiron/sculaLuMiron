<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14201A">
<title>Markdown Editor</title>
<style>
  :root {
    /* earth palette (shared brand base — see docs/THEME.md) */
    --bg: #14201A;
    --surface: #1B2A22;
    --surface-2: #22342A;
    --border: #2E4739;
    --accent: #C1BB45;
    --accent-2: #D3CD7C;
    --on-accent: #1A2117;
    --text: #F3EEE1;
    --text-2: #9FB3A5;
    --text-3: #5A6A60;
    --panel-w: 260px;
    --font-mono: 'Courier New', monospace;
    --font-ui: 'Trebuchet MS', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 52px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .logo { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-2); }
  .logo span { color: var(--text-3); font-weight: 400; }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font-ui);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: #A49F3B; border-color: #A49F3B; color: var(--on-accent); }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .toolbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 6px; }

  .tb-btn {
    background: transparent;
    border: none;
    color: var(--text-2);
    padding: 5px 8px;
    border-radius: 5px;
    font-size: 13px;
    font-family: var(--font-ui);
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    letter-spacing: 0.03em;
  }
  .tb-btn:hover { background: var(--border); color: var(--text); }
  .tb-btn.active { background: var(--accent); color: var(--on-accent); }
  .tb-btn:disabled { opacity: 0.35; cursor: default; }
  .tb-btn:disabled:hover { background: transparent; color: var(--text-2); }

  .tb-label { font-size: 11px; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 2px; }

  .tb-select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 12px;
    font-family: var(--font-ui);
    cursor: pointer;
    outline: none;
  }
  .tb-select:focus { border-color: var(--accent); }

  /* ── Main workspace ── */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Image Explorer Panel ── */
  #img-panel {
    width: var(--panel-w);
    min-width: var(--panel-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.22s ease, min-width 0.22s ease;
  }
  #img-panel.collapsed { width: 0; min-width: 0; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
  }
  .panel-close {
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
    padding: 0 2px;
    transition: color 0.12s;
  }
  .panel-close:hover { color: var(--text); }

  .panel-actions {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .panel-actions .btn { width: 100%; text-align: center; font-size: 11px; padding: 6px 10px; }

  #folder-name {
    font-size: 11px;
    color: var(--accent-2);
    font-family: var(--font-mono);
    padding: 0 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Workbooks panel (workbook → chapters, see docs/FEATURES.md § E) ── */
  #wb-panel {
    width: var(--panel-w);
    min-width: var(--panel-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.22s ease, min-width 0.22s ease;
    order: -1;
  }
  #wb-panel.collapsed { width: 0; min-width: 0; }

  #wb-where {
    font-size: 11px;
    color: var(--text-3);
    font-family: var(--font-mono);
    padding: 0 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #wb-tree { flex: 1; overflow-y: auto; padding: 4px 0; }
  #wb-tree::-webkit-scrollbar { width: 4px; }
  #wb-tree::-webkit-scrollbar-track { background: transparent; }
  #wb-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .wb-empty { padding: 16px 12px; font-size: 12px; color: var(--text-3); line-height: 1.7; }

  .wb-book { border-bottom: 1px solid var(--border); }
  .wb-book-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px 7px 10px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-2);
    letter-spacing: 0.04em;
  }
  .wb-book-row:hover { background: var(--surface-2); color: var(--text); }
  .wb-twist { flex-shrink: 0; width: 10px; font-size: 9px; color: var(--text-3); }
  .wb-book-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wb-count { font-size: 10px; color: var(--text-3); font-family: var(--font-mono); }
  .wb-acts { display: flex; gap: 1px; flex-shrink: 0; }
  .wb-act {
    background: none;
    border: none;
    color: var(--text-3);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    padding: 4px 5px;
    border-radius: 4px;
    transition: color 0.12s, background 0.12s;
  }
  .wb-act:hover { color: var(--accent-2); background: var(--bg); }

  .wb-chapters { display: none; padding-bottom: 4px; }
  .wb-book.open .wb-chapters { display: block; }
  .wb-ch-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px 6px 24px;
    cursor: pointer;
    font-size: 12px;
    color: var(--text-2);
    border-left: 2px solid transparent;
  }
  .wb-ch-row:hover { background: var(--surface-2); color: var(--text); }
  .wb-ch-row.current { border-left-color: var(--accent); background: var(--surface-2); color: var(--accent-2); }
  .wb-ch-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wb-ch-empty { padding: 6px 10px 6px 26px; font-size: 11px; color: var(--text-3); font-style: italic; }

  .wb-crumb {
    font-size: 11px;
    color: var(--accent-2);
    font-family: var(--font-mono);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    max-width: 340px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wb-crumb[hidden] { display: none; }

  #stat-wb { color: var(--text-2); }

  /* ── Tree ── */
  #tree-container {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #tree-container::-webkit-scrollbar { width: 4px; }
  #tree-container::-webkit-scrollbar-track { background: transparent; }
  #tree-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tree-loading {
    padding: 16px 12px;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
  }

  .tree-dir {
    user-select: none;
  }
  .tree-dir-label {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-2);
    cursor: pointer;
    transition: background 0.1s;
  }
  .tree-dir-label:hover { background: var(--surface-2); }
  .tree-arrow { font-size: 10px; color: var(--text-3); width: 10px; display: inline-block; transition: transform 0.15s; }
  .tree-arrow.open { transform: rotate(90deg); }
  .tree-dir-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .tree-children { display: none; }
  .tree-children.open { display: block; }

  .tree-img-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px 5px 22px;
    cursor: pointer;
    transition: background 0.1s;
    border-radius: 0;
  }
  .tree-img-item:hover { background: var(--surface-2); }
  .tree-img-item.selected { background: #C1BB4522; }

  .tree-thumb {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--bg);
  }
  .tree-img-name {
    font-size: 11px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  /* ── Image detail tooltip at bottom of panel ── */
  #img-detail {
    border-top: 1px solid var(--border);
    padding: 8px;
    flex-shrink: 0;
    display: none;
  }
  #img-detail.visible { display: block; }
  #detail-img {
    width: 100%;
    max-height: 140px;
    object-fit: contain;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--bg);
    display: block;
    margin-bottom: 6px;
  }
  #detail-info {
    font-size: 10px;
    color: var(--text-3);
    font-family: var(--font-mono);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-bottom: 6px;
  }
  #detail-insert {
    width: 100%;
    text-align: center;
    font-size: 11px;
    padding: 5px;
  }

  /* ── Editor panes ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }
  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pane + .pane { border-left: 1px solid var(--border); }
  .pane-header {
    padding: 8px 16px;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-3);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #editor {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.7;
    padding: 24px 28px;
    overflow-y: auto;
    tab-size: 2;
  }
  #editor::selection { background: #C1BB4540; }

  #preview {
    flex: 1;
    padding: 24px 28px;
    overflow-y: auto;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  #preview h1 { font-size: 2em; font-weight: 700; margin: 0 0 16px; color: var(--accent-2); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  #preview h2 { font-size: 1.55em; font-weight: 600; margin: 24px 0 12px; color: var(--accent-2); }
  #preview h3 { font-size: 1.3em; font-weight: 600; margin: 20px 0 10px; color: var(--text); }
  #preview h4 { font-size: 1.1em; font-weight: 600; margin: 16px 0 8px; color: var(--text); }
  #preview h5 { font-size: 1em; font-weight: 600; margin: 14px 0 6px; color: var(--text-2); }
  #preview h6 { font-size: 0.9em; font-weight: 600; margin: 12px 0 6px; color: var(--text-3); }
  #preview p { margin: 0 0 14px; }
  #preview ul { margin: 0 0 14px 22px; }
  #preview ol { margin: 0 0 14px 22px; }
  #preview li { margin: 4px 0; }
  #preview strong { color: var(--text); font-weight: 700; }
  #preview em { color: var(--accent-2); font-style: italic; }
  #preview img { max-width: 100%; border-radius: 6px; margin: 8px 0; border: 1px solid var(--border); }
  #preview code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-family: var(--font-mono); font-size: 0.88em; color: var(--accent-2); }

  /* ── Image modal ── */
  .image-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000bb;
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .image-modal.open { display: flex; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-title { font-size: 14px; font-weight: 600; letter-spacing: 0.05em; color: var(--text); }
  .field label { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 13px;
    font-family: var(--font-ui);
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field-hint { font-size: 11px; color: var(--text-3); margin-top: 5px; line-height: 1.5; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .local-pick { display: flex; align-items: center; gap: 10px; }
  .btn-pick {
    background: var(--surface-2);
    border: 1px dashed var(--border);
    color: var(--text-2);
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    font-family: var(--font-ui);
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-pick:hover { border-color: var(--accent); color: var(--accent-2); }
  .pick-name { font-size: 12px; color: var(--text-3); font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
  .img-thumb { display: none; width: 100%; max-height: 120px; object-fit: contain; border-radius: 6px; border: 1px solid var(--border); margin-top: 4px; background: var(--bg); }

  /* ── Status bar ── */
  /* ── Table builder modal ── */
  .table-modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    width: 520px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .table-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .table-controls label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-right: 4px; }
  .num-input {
    width: 56px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    padding: 5px 8px;
    font-size: 13px;
    font-family: var(--font-ui);
    outline: none;
    text-align: center;
  }
  .num-input:focus { border-color: var(--accent); }
  #table-preview-grid {
    overflow: auto;
    max-height: 280px;
  }
  .tbl-builder {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
  }
  .tbl-builder th, .tbl-builder td {
    border: 1px solid var(--border);
    padding: 0;
  }
  .tbl-builder th { background: var(--surface-2); }
  .tbl-builder input {
    background: transparent;
    border: none;
    color: var(--text);
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--font-ui);
    outline: none;
    width: 100%;
    min-width: 80px;
  }
  .tbl-builder th input { color: var(--accent-2); font-weight: 600; }
  .tbl-builder input:focus { background: #C1BB4515; }
  .align-row td { background: var(--surface-2); padding: 2px 4px; text-align: center; }
  .align-select {
    background: transparent;
    border: none;
    color: var(--text-3);
    font-size: 11px;
    font-family: var(--font-ui);
    cursor: pointer;
    outline: none;
    width: 100%;
  }

  /* ── Code block preview ── */
  #preview pre {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 18px;
    overflow-x: auto;
    margin: 0 0 14px;
  }
  #preview pre code {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }
  #preview table {
    border-collapse: collapse;
    width: 100%;
    margin: 0 0 14px;
    font-size: 14px;
  }
  #preview th, #preview td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    text-align: left;
  }
  #preview th { background: var(--surface-2); color: var(--accent-2); font-weight: 600; }
  #preview tr:nth-child(even) td { background: #ffffff06; }

  /* ── Navigation panel ── */
  #nav-panel {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: width 0.22s ease, min-width 0.22s ease;
    order: 99;
  }
  #nav-panel.collapsed { width: 0; min-width: 0; }

  #nav-panel .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #nav-tree {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }
  #nav-tree::-webkit-scrollbar { width: 4px; }
  #nav-tree::-webkit-scrollbar-track { background: transparent; }
  #nav-tree::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .nav-empty {
    padding: 16px 12px;
    font-size: 12px;
    color: var(--text-3);
    text-align: center;
  }

  .nav-item {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 4px 12px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s, border-color 0.1s;
    text-decoration: none;
    color: inherit;
    line-height: 1.4;
  }
  .nav-item:hover { background: var(--surface-2); border-left-color: var(--accent); }
  .nav-item.active { background: #C1BB4515; border-left-color: var(--accent); }

  /* H1 */
  .nav-h1 { padding-left: 12px; }
  .nav-h1 .nav-label { font-size: 13px; font-weight: 700; color: var(--accent-2); }

  /* H2 */
  .nav-h2 { padding-left: 20px; }
  .nav-h2 .nav-label { font-size: 12px; font-weight: 600; color: var(--text); }

  /* H3 */
  .nav-h3 { padding-left: 28px; }
  .nav-h3 .nav-label { font-size: 12px; font-weight: 400; font-style: italic; color: var(--text); }

  /* H4 */
  .nav-h4 { padding-left: 36px; }
  .nav-h4 .nav-label { font-size: 11px; font-weight: 400; color: var(--text-2); }

  /* H5 */
  .nav-h5 { padding-left: 44px; }
  .nav-h5 .nav-label { font-size: 11px; font-weight: 400; font-style: italic; color: var(--text-3); }

  /* H6 */
  .nav-h6 { padding-left: 52px; }
  .nav-h6 .nav-label { font-size: 10px; font-weight: 400; color: var(--text-3); }

  .nav-bullet {
    flex-shrink: 0;
    font-size: 9px;
    color: var(--text-3);
    margin-top: 1px;
  }

  .file-name { font-size: 12px; color: var(--text-3); padding: 6px 10px; background: var(--bg); border: 1px dashed var(--border); border-radius: 5px; font-family: var(--font-mono); }
  #status-bar { display: flex; gap: 20px; padding: 4px 16px; font-size: 11px; color: var(--text-3); background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; }

  /* ── Mobile view tabs (hidden on desktop) ── */
  #view-tabs {
    display: none;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #view-tabs button {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;

  /* ═══════════ TABLET (≤ 1024px) ═══════════ */
  @media (max-width: 1024px) {
    :root { --panel-w: 240px; }

  }

  /* ═══════════ MOBILE (≤ 700px) ═══════════ */
  @media (max-width: 700px) {
    :root { --panel-w: 82vw; }

    header {
      padding: 6px 12px;

    .logo { font-size: 13px; }

<script>
(function(){
  var here = location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll("#site-nav a").forEach(function(a){
    if(a.getAttribute("data-page") === here) a.classList.add("current");
  });
  // Shared UI-language toggle - see docs/I18N.md "Shared preference across
  // pages". This block is byte-identical in all three files (CLAUDE.md rule
  // 2); it only paints itself from localStorage and broadcasts a
  // "scula-ui-lang" event. Each app's own script (loaded later, at the
  // bottom of the page) owns the actual translation via its own I18N/t()/
  // applyUILang() and reconciles against its async storage as the source of
  // truth - see that file's "6. UI language" section.
  var LANG_KEY = "scula:ui-lang";
  var lang = "ro";
  try{ lang = localStorage.getItem(LANG_KEY) || "ro"; }catch(e){}

  var btn = document.getElementById("navLangBtn");
  if(btn){
    paintLang(lang);
    btn.addEventListener("click", function(){
      lang = lang === "ro" ? "en" : "ro";
      try{ localStorage.setItem(LANG_KEY, lang); }catch(e){}
      paintLang(lang);
      paintFolder();
      window.dispatchEvent(new CustomEvent("scula-ui-lang", { detail: lang }));
    });
  }
  function paintLang(l){ btn.textContent = l === "ro" ? "EN" : "RO"; }

  // Some apps toggle the language from their own controls; follow along.
  window.addEventListener("scula-ui-lang", function(ev){
    if(ev.detail && ev.detail !== lang){ lang = ev.detail; if(btn) paintLang(lang); paintFolder(); }
  });

  /* ============================================================
     Shared save destination (window.ScuLaFolder)
     ------------------------------------------------------------
     Pages never build their own <a download>; they call
     ScuLaFolder.save(name, blob) and this decides where the bytes go.
     Three routes, in order of preference:

       "folder"   desktop Chrome/Edge. One directory picked once via the
                  File System Access API, kept in IndexedDB (a directory
                  handle is not a string, so localStorage cannot hold
                  it). Each page writes into its own subfolder - SUBDIR.
       "share"    phones and tablets, where no browser implements
                  showDirectoryPicker. navigator.share({files}) hands the
                  file to the OS share sheet, where "Save to Files"
                  (iOS) / the Files app (Android) lets the person drop it
                  in any folder they like. No folder can be *remembered*
                  there - the OS picker owns that choice.
       "download" last resort, and always available.

     Byte-identical in all three files (CLAUDE.md rule 2) - see
     docs/FEATURES.md "Saving files".
     ============================================================ */
  var DB_NAME = "scula-fs", DB_STORE = "handles", DB_KEY = "root", MODE_KEY = "mode";
  var SUBDIR = {
    "index.html": "transcript",
    "editor.html": "desen",
    "markdown-editor.html": "markdown",
    "recipes.html": "retete"
  };
  var T = {
    ro:{
      pickLabel:"Dosar",
      modeShare:"Fișiere",
      modeDownload:"Descărcări",
      tipDesktop:"Alege dosarul implicit pentru fișierele salvate (clic dreapta: renunță la dosar)",
      tipMobile:"Alege unde ajung fișierele salvate",
      unsupported:"Browserul acesta nu poate ține minte un dosar. Fișierele se descarcă normal.",
      denied:"Acces refuzat la dosar. Fișierele se descarcă normal.",
      picked:function(n){ return "Dosar implicit: " + n; },
      cleared:"Dosarul implicit a fost șters. Fișierele se descarcă normal.",
      clearAsk:function(n){ return "Renunți la dosarul implicit „" + n + "”?"; },
      saved:function(p){ return "Salvat în " + p; },
      shared:function(n){ return "Trimis către aplicații: " + n; },
      downloaded:function(n){ return "Descărcat: " + n; },
      failed:"Nu s-a putut scrie în dosar. Fișierul a fost descărcat.",
      tapToSave:function(n){ return "Fișierul „" + n + "” e gata."; },
      tapAction:"Salvează",
      sheetTitle:"Unde salvezi fișierele?",
      sheetIntroMobile:"Pe telefon și tabletă niciun browser nu poate ține minte un dosar. Prin „Salvează în Fișiere” alegi tu dosarul de fiecare dată - iar sistemul îl reține pe ultimul folosit.",
      sheetIntroDesktop:"Alege ce se întâmplă când salvezi.",
      optShare:"Salvează în Fișiere",
      optShareSub:"Deschide fereastra de partajare a sistemului: alegi dosarul pe care îl vrei.",
      optShareOff:"Browserul acesta nu poate trimite fișiere către aplicații.",
      optDownload:"Descarcă",
      optDownloadSub:"Merge direct în dosarul Descărcări.",
      optFolder:"Alege un dosar…",
      optFolderSub:"Un singur dosar pentru toate paginile, ținut minte între vizite.",
      sheetClose:"Închide",
      modeSetShare:"Fișierele merg către fereastra de partajare.",
      modeSetDownload:"Fișierele se descarcă."
    },
    en:{
      pickLabel:"Folder",
      modeShare:"Files",
      modeDownload:"Downloads",
      tipDesktop:"Choose the default folder for saved files (right-click: forget the folder)",
      tipMobile:"Choose where saved files go",
      unsupported:"This browser can't remember a folder. Files download normally instead.",
      denied:"Folder access denied. Files download normally instead.",
      picked:function(n){ return "Default folder: " + n; },
      cleared:"Default folder cleared. Files download normally instead.",
      clearAsk:function(n){ return "Forget the default folder “" + n + "”?"; },
      saved:function(p){ return "Saved to " + p; },
      shared:function(n){ return "Sent to your apps: " + n; },
      downloaded:function(n){ return "Downloaded: " + n; },
      failed:"Couldn't write into the folder. The file was downloaded instead.",
      tapToSave:function(n){ return "“" + n + "” is ready."; },
      tapAction:"Save",
      sheetTitle:"Where do saved files go?",
      sheetIntroMobile:"On phones and tablets no browser can remember a folder. “Save to Files” lets you pick the folder yourself each time - and the system remembers the last one you used.",
      sheetIntroDesktop:"Choose what happens when you save.",
      optShare:"Save to Files",
      optShareSub:"Opens the system share sheet, where you pick any folder you like.",
      optShareOff:"This browser can't hand files to other apps.",
      optDownload:"Download",
      optDownloadSub:"Goes straight to the Downloads folder.",
      optFolder:"Choose a folder…",
      optFolderSub:"One folder for every page, remembered between visits.",
      sheetClose:"Close",
      modeSetShare:"Files now go to the share sheet.",
      modeSetDownload:"Files now download."
    }
  };
  function tx(k){ return (T[lang] || T.ro)[k]; }

  var fBtn = document.getElementById("navFolderBtn");
  var fName = document.getElementById("navFolderName");
  var root = null;          // FileSystemDirectoryHandle, desktop only
  var mode = null;          // "share" | "download" | null (= pick for me)
  var toastEl = null, toastTimer = 0;
  var sheetEl = null;

  function supported(){ return typeof window.showDirectoryPicker === "function"; }
  function subdir(){ return SUBDIR[here] || "scula"; }

  // Sharing a *file* is Web Share level 2: iOS Safari 15+, Android Chrome.
  // canShare() is the only honest test - navigator.share alone exists in
  // browsers that refuse files.
  function canShareFiles(){
    try{
      if(!navigator.share || !navigator.canShare || typeof File !== "function") return false;
      return navigator.canShare({ files:[ new File(["x"], "x.txt", { type:"text/plain" }) ] });
    }catch(e){ return false; }
  }

  function currentMode(){
    if(root) return "folder";
    if(mode === "share") return canShareFiles() ? "share" : "download";
    if(mode === "download") return "download";
    // Unset: on a device with no directory picker the share sheet is the
    // only route into a folder the person chooses, so prefer it there.
    return (!supported() && canShareFiles()) ? "share" : "download";
  }

  function toast(msg, action, onAction){
    if(!msg) return;
    if(!toastEl){
      toastEl = document.createElement("div");
      toastEl.id = "scula-toast";
      toastEl.setAttribute("role", "status");
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = "";
    toastEl.classList.remove("acting");
    toastEl.appendChild(document.createTextNode(msg));
    clearTimeout(toastTimer);
    if(action && onAction){
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = action;
      b.addEventListener("click", function(){
        toastEl.classList.remove("show", "acting");
        onAction();
      });
      toastEl.appendChild(b);
      toastEl.classList.add("acting");
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show", "acting"); }, 30000);
    } else {
      toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 4200);
    }
    toastEl.classList.add("show");
  }

  function paintFolder(){
    if(!fBtn) return;
    var m = currentMode();
    fBtn.title = supported() ? tx("tipDesktop") : tx("tipMobile");
    fBtn.setAttribute("aria-label", fBtn.title);
    // Desktop with nothing chosen yet reads as an invitation ("Dosar"), since
    // the tap opens the picker. Where there is no picker the button names the
    // route a save will actually take, because that is what the tap changes.
    fName.textContent = m === "folder" ? root.name
      : (supported() ? tx("pickLabel")
      : (m === "share" ? tx("modeShare") : tx("modeDownload")));
    fBtn.classList.toggle("set", m === "folder" || (!supported() && m === "share"));
  }

  function idb(){
    return new Promise(function(res, rej){
      var r;
      try{ r = indexedDB.open(DB_NAME, 1); }catch(e){ rej(e); return; }
      r.onupgradeneeded = function(){ r.result.createObjectStore(DB_STORE); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function idbTx(mode2, run){
    return idb().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction(DB_STORE, mode2);
        var req = run(t.objectStore(DB_STORE));
        t.oncomplete = function(){ db.close(); res(req ? req.result : undefined); };
        t.onerror = function(){ db.close(); rej(t.error); };
      });
    });
  }
  function idbGet(k){ return idbTx("readonly", function(s){ return s.get(k); }); }
  function idbPut(k, v){ return idbTx("readwrite", function(s){ return s.put(v, k); }); }
  function idbDel(k){ return idbTx("readwrite", function(s){ return s.delete(k); }); }

  // requestPermission() needs a user gesture, so pass request:true only from
  // inside a click handler.
  function permitted(handle, request){
    if(!handle || typeof handle.queryPermission !== "function") return Promise.resolve(!!handle);
    var opts = { mode:"readwrite" };
    return handle.queryPermission(opts).then(function(state){
      if(state === "granted") return true;
      if(!request) return false;
      return handle.requestPermission(opts).then(function(s){ return s === "granted"; });
    }).catch(function(){ return false; });
  }

  function announce(){
    paintFolder();
    window.dispatchEvent(new CustomEvent("scula-folder", {
      detail: { name: root ? root.name : null, mode: currentMode() }
    }));
  }

  function pick(){
    if(!supported()){ toast(tx("unsupported")); return Promise.resolve(null); }
    return window.showDirectoryPicker({ id:"scula-root", mode:"readwrite", startIn:"documents" })
      .then(function(h){
        return permitted(h, true).then(function(ok){
          if(!ok){ toast(tx("denied")); return null; }
          root = h;
          return idbPut(DB_KEY, h).catch(function(){}).then(function(){
            // Give every page its folder up front, so the layout is visible
            // in the file manager before anything has been saved.
            var chain = Promise.resolve();
            Object.keys(SUBDIR).forEach(function(k){
              chain = chain.then(function(){
                return h.getDirectoryHandle(SUBDIR[k], { create:true }).catch(function(){});
              });
            });
            return chain;
          }).then(function(){
            announce();
            toast(tx("picked")(h.name));
            return h;
          });
        });
      })
      .catch(function(){ return null; });  // AbortError: the user cancelled
  }

  function forget(){
    root = null;
    return idbDel(DB_KEY).catch(function(){}).then(function(){
      announce();
      toast(tx("cleared"));
    });
  }

  function setMode(m){
    mode = m;
    return idbPut(MODE_KEY, m).catch(function(){}).then(function(){
      announce();
      toast(m === "share" ? tx("modeSetShare") : tx("modeSetDownload"));
      return m;
    });
  }

  /* ---- the "where do files go?" sheet (mobile's stand-in for a picker) ---- */
  function closeSheet(){ if(sheetEl) sheetEl.classList.remove("open"); }

  function option(label, sub, on, enabled, onPick){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "opt" + (on ? " on" : "");
    b.appendChild(document.createTextNode(label));
    var s = document.createElement("small");
    s.textContent = sub;
    b.appendChild(s);
    if(enabled) b.addEventListener("click", onPick); else b.disabled = true;
    return b;
  }

  function openSheet(){
    var m = currentMode();
    if(!sheetEl){
      sheetEl = document.createElement("div");
      sheetEl.id = "scula-sheet";
      sheetEl.setAttribute("role", "dialog");
      sheetEl.setAttribute("aria-modal", "true");
      sheetEl.addEventListener("click", function(ev){ if(ev.target === sheetEl) closeSheet(); });
      document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeSheet(); });
      document.body.appendChild(sheetEl);
    }
    var card = document.createElement("div");
    card.className = "card";
    var h = document.createElement("h2");
    h.textContent = tx("sheetTitle");
    var p = document.createElement("p");
    p.textContent = supported() ? tx("sheetIntroDesktop") : tx("sheetIntroMobile");
    card.appendChild(h);
    card.appendChild(p);

    if(supported()){
      card.appendChild(option(tx("optFolder"), tx("optFolderSub"), m === "folder", true,
        function(){ closeSheet(); pick(); }));
    }
    var shareOk = canShareFiles();
    card.appendChild(option(tx("optShare"), shareOk ? tx("optShareSub") : tx("optShareOff"),
      m === "share", shareOk, function(){ closeSheet(); setMode("share"); }));
    card.appendChild(option(tx("optDownload"), tx("optDownloadSub"), m === "download", true,
      function(){ closeSheet(); setMode("download"); }));

    var c = document.createElement("button");
    c.type = "button";
    c.className = "close";
    c.textContent = tx("sheetClose");
    c.addEventListener("click", closeSheet);
    card.appendChild(c);

    sheetEl.textContent = "";
    sheetEl.appendChild(card);
    sheetEl.classList.add("open");
  }

  // Resolves to this page's subfolder handle, or null when unavailable.
  function dir(request){
    if(!root) return Promise.resolve(null);
    return permitted(root, request !== false).then(function(ok){
      if(!ok) return null;
      return root.getDirectoryHandle(subdir(), { create:true });
    }).catch(function(){ return null; });
  }

  // Never overwrite: "a.png" taken -> "a-1.png", "a-2.png", …
  function freeName(d, filename){
    var dot = filename.lastIndexOf(".");
    var base = dot > 0 ? filename.slice(0, dot) : filename;
    var ext = dot > 0 ? filename.slice(dot) : "";
    var i = 0;
    function attempt(){
      var name = i === 0 ? filename : base + "-" + i + ext;
      return d.getFileHandle(name).then(function(){
        i++;
        return i > 500 ? name : attempt();
      }, function(){ return name; });
    }
    return attempt();
  }

  function download(filename, blob){
    var a = document.createElement("a");
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  function report(r, quiet){
    if(!quiet && r.message) toast(r.message);
    return r;
  }
  function downloadResult(filename, blob, quiet, extra){
    download(filename, blob);
    return report({ saved:false, via:"download", name:filename, path:filename,
                    message:(extra ? extra + " " : "") + tx("downloaded")(filename) }, quiet);
  }

  // iOS accepts only a short list of types in the share sheet; text/markdown
  // is not on it, so retry text formats as plain text before giving up.
  function shareable(filename, blob){
    var f;
    try{ f = new File([blob], filename, { type: blob.type || "application/octet-stream" }); }
    catch(e){ return null; }
    try{ if(navigator.canShare({ files:[f] })) return f; }catch(e){}
    if(/\.(md|txt|html?)$/i.test(filename)){
      try{
        var f2 = new File([blob], filename, { type:"text/plain" });
        if(navigator.canShare({ files:[f2] })) return f2;
      }catch(e){}
    }
    return null;
  }

  function shareOut(filename, blob, quiet){
    var file = shareable(filename, blob);
    if(!file) return Promise.resolve(downloadResult(filename, blob, quiet));
    // No `title`/`text` here: iOS's "Save to Files" reads any text field
    // alongside `files` as a *second* shareable item and drops a companion
    // "text" file next to the real one. Filename-only files avoids that.
    return navigator.share({ files:[file] }).then(function(){
      return report({ saved:true, via:"share", name:filename, path:filename,
                      message: tx("shared")(filename) }, quiet);
    }, function(err){
      var n = err && err.name;
      // The person backed out of the share sheet - that is not a failure, and
      // silently downloading behind their back would be wrong.
      if(n === "AbortError") return { saved:false, cancelled:true, name:filename, path:filename, message:null };
      // Producing the file (a big canvas, a zip) outlived the tap that started
      // it, and iOS will not open the sheet without one. Offer a fresh tap.
      if(n === "NotAllowedError" || n === "SecurityError"){
        toast(tx("tapToSave")(filename), tx("tapAction"), function(){ shareOut(filename, blob, quiet); });
        return { saved:false, pending:true, name:filename, path:filename, message:null };
      }
      return downloadResult(filename, blob, quiet);
    });
  }

  // The one call pages make. Always resolves. Read `message` to say what
  // happened in the app's own UI (null = say nothing), or leave `quiet` off
  // and the shared toast speaks.
  function save(filename, blob, opts){
    var quiet = !!(opts && opts.quiet);
    var m = currentMode();
    if(m === "share") return shareOut(filename, blob, quiet);
    if(m !== "folder") return Promise.resolve(downloadResult(filename, blob, quiet));
    return dir().then(function(d){
      if(!d) return null;
      return freeName(d, filename).then(function(name){
        return d.getFileHandle(name, { create:true }).then(function(fh){
          return fh.createWritable().then(function(w){
            return Promise.resolve(w.write(blob)).then(function(){ return w.close(); });
          }).then(function(){
            return { saved:true, via:"folder", name:name,
                     path: root.name + "/" + subdir() + "/" + name };
          });
        });
      });
    }).catch(function(){ return { failed:true }; }).then(function(r){
      if(r && r.saved){ r.message = tx("saved")(r.path); return report(r, quiet); }
      return downloadResult(filename, blob, quiet, r && r.failed ? tx("failed") : "");
    });
  }

  var ready = Promise.all([
    idbGet(DB_KEY).catch(function(){ return null; }),
    idbGet(MODE_KEY).catch(function(){ return null; })
  ]).then(function(vals){
    if(vals[1] === "share" || vals[1] === "download") mode = vals[1];
    var h = vals[0];
    if(!h){ paintFolder(); return null; }
    return permitted(h, false).then(function(ok){
      // Not granted yet is fine - the first save re-asks inside a gesture.
      root = h;
      paintFolder();
      return ok ? h : null;
    });
  }).catch(function(){ paintFolder(); return null; });

  if(fBtn){
    paintFolder();
    // Desktop goes straight to the directory picker - that is the whole
    // feature there. Everywhere else the picker does not exist, so offer the
    // routes that do.
    fBtn.addEventListener("click", function(){ if(supported()) pick(); else openSheet(); });
    fBtn.addEventListener("contextmenu", function(ev){
      ev.preventDefault();
      if(root && confirm(tx("clearAsk")(root.name))) forget();
      else openSheet();
    });
  }

  window.ScuLaFolder = {
    supported: supported,
    canShareFiles: canShareFiles,
    isSet: function(){ return !!root; },
    name: function(){ return root ? root.name : null; },
    mode: currentMode,
    setMode: setMode,
    subdir: subdir,
    ready: ready,
    pick: pick,
    forget: forget,
    chooser: openSheet,
    dir: dir,
    save: save,
    download: download,
    toast: toast
  };
})();
</script>

let UI = "ro";
function t(k,a){ const v = I18N[UI][k]; return typeof v === "function" ? v(a) : v; }
const LANG_KEY = "scula:ui-lang";
const store = (function(){
  const hasWS = typeof window.storage === "object" && window.storage && typeof window.storage.get === "function";
  let ls = null;
  if(!hasWS){
    try{ localStorage.setItem("__md","1"); localStorage.removeItem("__md"); ls = localStorage; }
    catch(e){ ls = null; }
  }
  const mem = {};
  return {
    async get(k){
      if(hasWS){ try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
      if(ls){ try{ return ls.getItem(k); }catch(e){ return null; } }
      return mem[k] || null;
    },
    async set(k,v){
      if(hasWS){ try{ await window.storage.set(k,v); return; }catch(e){} }
      if(ls){ try{ ls.setItem(k,v); return; }catch(e){} }
      mem[k] = v;
    }
  };
})();
const UI_ATTRS = ["placeholder", "title", "aria-label", "value", "alt"];
function applyUILang(){
  document.documentElement.lang = UI;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.getAttribute("data-i")); });
  UI_ATTRS.forEach(attr => {
    const d = "data-i-" + attr.replace("aria-label", "aria");
    document.querySelectorAll("[" + d + "]").forEach(el => el.setAttribute(attr, t(el.getAttribute(d))));
  });
  const navBtn = document.getElementById("navLangBtn");
  if(navBtn) navBtn.textContent = UI === "ro" ? "EN" : "RO";
  try{ localStorage.setItem(LANG_KEY, UI); }catch(e){}
  if(typeof updateStatus === "function") updateStatus();
  // The workbook tree is generated, not markup, so data-i can't reach it.
  // wbBooted is a `var` on purpose: this runs before the rest of the script.
  if(typeof renderWorkbooks === "function" && wbBooted) renderWorkbooks();
}
window.addEventListener("scula-ui-lang", e => { UI = e.detail; applyUILang(); store.set(LANG_KEY, UI); });
(async function initUILang(){
  let saved = null;
  try{ saved = await store.get(LANG_KEY); }catch(e){}
  UI = saved === "en" || saved === "ro" ? saved : "ro";
  applyUILang();
})();

const editor = document.getElementById('editor');
const preview = document.getElementById('preview');
let savedRange = null;

/* ── Selection helpers ── */
function saveSelection() {
  savedRange = { start: editor.selectionStart, end: editor.selectionEnd };
}
function restoreSelection() {
  if (savedRange) { editor.focus(); editor.setSelectionRange(savedRange.start, savedRange.end); }
}
function insertAtCursor(text) {
  editor.focus();
  const s = editor.selectionStart, e = editor.selectionEnd;
  editor.setRangeText(text, s, e, 'end');
  updatePreview(); updateStatus();
}

/* ── Toolbar actions ── */
function wrapSelection(before, after) {
  editor.focus();
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end);
  const replacement = before + (sel || 'text') + after;
  editor.setRangeText(replacement, start, end, 'select');
  if (!sel) editor.setSelectionRange(start + before.length, start + before.length + 4);
  updatePreview(); updateStatus();
}

function insertHeading(level) {
  if (!level) return;
  editor.focus();
  const start = editor.selectionStart, val = editor.value;
  const lineStart = val.lastIndexOf('\n', start - 1) + 1;
  const lineEnd = val.indexOf('\n', start);
  const end = lineEnd === -1 ? val.length : lineEnd;
  const stripped = val.substring(lineStart, end).replace(/^#{1,6}\s*/, '');
  editor.setRangeText('#'.repeat(parseInt(level)) + ' ' + stripped, lineStart, end, 'end');
  document.getElementById('heading-select').value = '';
  updatePreview(); updateStatus();
}

function insertList() {
  editor.focus();
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end);
  if (sel) {
    editor.setRangeText(sel.split('\n').map(l => '- ' + l).join('\n'), start, end, 'end');
  } else {
    const val = editor.value;
    const lineStart = val.lastIndexOf('\n', start - 1) + 1;
    const lineEnd = val.indexOf('\n', start);
    const lineEndPos = lineEnd === -1 ? val.length : lineEnd;
    const line = val.substring(lineStart, lineEndPos);
    if (!line.startsWith('- ')) editor.setRangeText('- ' + line, lineStart, lineEndPos, 'end');
    else insertAtCursor('\n- ');
  }
  updatePreview(); updateStatus();
}

function insertOrderedList() {
  editor.focus();
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end);
  if (sel) {
    const lines = sel.split('\n').map((l, i) => `${i + 1}. ${l}`).join('\n');
    editor.setRangeText(lines, start, end, 'end');
  } else {
    const val = editor.value;
    const lineStart = val.lastIndexOf('\n', start - 1) + 1;
    const lineEnd = val.indexOf('\n', start);
    const lineEndPos = lineEnd === -1 ? val.length : lineEnd;
    const line = val.substring(lineStart, lineEndPos);
    if (!/^\d+\.\s/.test(line)) {
      // find what number to continue from by looking at the line above
      const prevText = val.substring(0, lineStart);
      const prevLines = prevText.split('\n');
      let nextNum = 1;
      for (let i = prevLines.length - 1; i >= 0; i--) {
        const m = prevLines[i].match(/^(\d+)\.\s/);
        if (m) { nextNum = parseInt(m[1]) + 1; break; }
        if (prevLines[i].trim() !== '') break;
      }
      editor.setRangeText(`${nextNum}. ${line}`, lineStart, lineEndPos, 'end');
    } else {
      const m = line.match(/^(\d+)\./);
      const nextNum = m ? parseInt(m[1]) + 1 : 1;
      insertAtCursor(`\n${nextNum}. `);
    }
  }
  updatePreview(); updateStatus();
}

function insertFontSize(size) {
  if (!size) return;
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end) || 'text';
  editor.focus();
  editor.setRangeText(`<span style="font-size:${size}px">${sel}</span>`, start, end, 'end');
  document.getElementById('size-select').value = '';
  updatePreview(); updateStatus();
}

function handleLocalImage(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    document.getElementById('img-url').value = dataUrl;
    document.getElementById('pick-name').textContent = file.name;
    if (!document.getElementById('img-alt').value)
      document.getElementById('img-alt').value = file.name.replace(/\.[^.]+$/, '');
    const thumb = document.getElementById('img-thumb');
    thumb.src = dataUrl; thumb.style.display = 'block';
  };
  reader.readAsDataURL(file);
}
function insertImage() {
  const url = document.getElementById('img-url').value.trim();
  const alt = document.getElementById('img-alt').value.trim() || 'image';
  const title = document.getElementById('img-title').value.trim();
  if (!url) { document.getElementById('img-url').focus(); return; }
  const md = title ? `![${alt}](${url} "${title}")` : `![${alt}](${url})`;
  closeImageModal(); restoreSelection(); insertAtCursor(md);
}

const IMAGE_EXTS = new Set(['.png','.jpg','.jpeg','.gif','.webp','.svg','.avif','.bmp','.ico','.tiff','.tif']);

function isImage(name) {
  const ext = name.substring(name.lastIndexOf('.')).toLowerCase();
  return IMAGE_EXTS.has(ext);

// Every side panel, paired with the toolbar button that opens it.
const PANELS = {
  'wb-panel': 'btn-workbooks',
  'img-panel': 'btn-explorer',
  'nav-panel': 'btn-nav'
};

function syncBackdrop() {
  const anyOpen = Object.keys(PANELS).some(id => !document.getElementById(id).classList.contains('collapsed'));
  document.getElementById('panel-backdrop').classList.toggle('show', anyOpen && isSmallScreen());
}

function closeAllPanels() {
  Object.keys(PANELS).forEach(id => {
    document.getElementById(id).classList.add('collapsed');
    document.getElementById(PANELS[id]).classList.remove('active');
  });
  syncBackdrop();
}

function togglePanelById(id) {
  const panel = document.getElementById(id);
  const btn = document.getElementById(PANELS[id]);
  const willOpen = panel.classList.contains('collapsed');
  // On small screens the panels overlay the text, so only one at a time
  if (willOpen && isSmallScreen()) {
    Object.keys(PANELS).forEach(other => {
      if (other === id) return;
      document.getElementById(other).classList.add('collapsed');
      document.getElementById(PANELS[other]).classList.remove('active');
    });
  }
  const collapsed = panel.classList.toggle('collapsed');
  btn.classList.toggle('active', !collapsed);
  syncBackdrop();
}

function toggleWorkbooks() { togglePanelById('wb-panel'); }
function togglePanel() { togglePanelById('img-panel'); }
function toggleNav() { togglePanelById('nav-panel'); }

async function setWorkingFolder() {
  if (!window.showDirectoryPicker) {
    alert(t('noFsApi'));
    return;
  }
  try {
    workingFolderHandle = await window.showDirectoryPicker({ mode: 'read' });
    document.getElementById('folder-name').textContent = '📂 ' + workingFolderHandle.name;
    selectedImageEntry = null;
    document.getElementById('img-detail').classList.remove('visible');
    await buildTree();
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

async function buildTree() {
  const container = document.getElementById('tree-container');
  container.innerHTML = '<div class="tree-loading">' + t('scanningFolder') + '</div>';
  try {
    const root = await buildDirNode(workingFolderHandle, '');
    container.innerHTML = '';
    if (!root) {
      container.innerHTML = '<div class="tree-loading">' + t('noImagesFound') + '</div>';
      return;
    }
    container.appendChild(root);
  } catch(e) {
    container.innerHTML = '<div class="tree-loading">' + t('errorReadingFolder') + '</div>';
    console.error(e);
  }
}

async function buildDirNode(dirHandle, pathPrefix) {
  const dirEl = document.createElement('div');
  dirEl.className = 'tree-dir';

  const childrenEl = document.createElement('div');
  childrenEl.className = 'tree-children';

  let hasContent = false;

  // collect entries, sort: dirs first, then files
  const entries = [];
  for await (const [name, handle] of dirHandle.entries()) {
    entries.push({ name, handle });
  }
  entries.sort((a, b) => {
    if (a.handle.kind !== b.handle.kind) return a.handle.kind === 'directory' ? -1 : 1;
    return a.name.localeCompare(b.name);
  });

  for (const { name, handle } of entries) {
    if (handle.kind === 'directory') {
      const subPath = pathPrefix ? pathPrefix + '/' + name : name;
      const subNode = await buildDirNode(handle, subPath);
      if (subNode) { childrenEl.appendChild(subNode); hasContent = true; }
    } else if (handle.kind === 'file' && isImage(name)) {
      const relPath = pathPrefix ? pathPrefix + '/' + name : name;
      const itemEl = createImageItem(name, relPath, handle);
      childrenEl.appendChild(itemEl);
      hasContent = true;
    }
  }

  if (!hasContent) return null;

  // Only add the dir label if this isn't the root (pathPrefix is empty for root)
  if (pathPrefix !== '') {
    const labelEl = document.createElement('div');
    labelEl.className = 'tree-dir-label';
    const arrow = document.createElement('span');
    arrow.className = 'tree-arrow';
    arrow.textContent = '▶';
    const nameEl = document.createElement('span');
    nameEl.className = 'tree-dir-name';
    nameEl.textContent = '📁 ' + dirHandle.name;
    labelEl.appendChild(arrow);
    labelEl.appendChild(nameEl);
    labelEl.addEventListener('click', () => {
      const open = childrenEl.classList.toggle('open');
      arrow.classList.toggle('open', open);
    });
    dirEl.appendChild(labelEl);
  } else {
    // root: auto-expand
    childrenEl.classList.add('open');
  }

  dirEl.appendChild(childrenEl);
  return dirEl;
}

function createImageItem(name, relPath, fileHandle) {
  const item = document.createElement('div');
  item.className = 'tree-img-item';

  const thumb = document.createElement('img');
  thumb.className = 'tree-thumb';
  thumb.alt = name;

  // load thumbnail lazily
  fileHandle.getFile().then(file => {
    const url = URL.createObjectURL(file);
    thumb.src = url;
    thumb.dataset.objUrl = url;
  });

  const label = document.createElement('span');
  label.className = 'tree-img-name';
  label.textContent = name;
  label.title = relPath;

  item.appendChild(thumb);
  item.appendChild(label);

  item.addEventListener('click', () => {
    // deselect previous
    document.querySelectorAll('.tree-img-item.selected').forEach(el => el.classList.remove('selected'));
    item.classList.add('selected');
    showImageDetail(name, relPath, fileHandle, thumb.dataset.objUrl || thumb.src);
  });

  item.addEventListener('dblclick', () => {
    if (selectedImageEntry) insertSelectedImage();
  });

  return item;
}

function showImageDetail(name, relPath, fileHandle, objUrl) {
  selectedImageEntry = { relPath, fileHandle, objUrl };
  const detail = document.getElementById('img-detail');
  document.getElementById('detail-img').src = objUrl;
  document.getElementById('detail-info').textContent = relPath;
  detail.classList.add('visible');
}

function insertSelectedImage() {
  if (!selectedImageEntry) return;
  if (isMobile()) {
    setView('source');
    document.getElementById('img-panel').classList.add('collapsed');
    document.getElementById('btn-explorer').classList.remove('active');
    syncBackdrop();
  }
  insertAtCursor(selectedImageEntry.relPath);
}
